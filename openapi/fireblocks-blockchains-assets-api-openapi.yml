          $ref: '#/components/schemas/AssetNoteRequest'
    AssetFeature:
      type: string
      description: Asset feature
      example: STABLECOIN
      enum:
      - STABLECOIN
    AssetMedia:
      type: object
      properties:
        url:
          type: string
          description: Media URL
          example: https://example.com/image.png
        type:
          type: string
          description: Media type
          example: image/svg+xml
          enum:
          - image/svg+xml
          - image/png
        attributes:
          description: Media attributes
          type: object
          properties:
            monochrome:
              type: boolean
              description: Monochrome flag
              example: true
      required:
      - url
      - type
    BlockchainMetadata:
      type: object
      properties:
