        in: query
        description: Page cursor to fetch
        schema:
          type: string
      - name: pageSize
        required: false
        in: query
        description: Items per page (max 100)
        schema:
          minimum: 1
          maximum: 100
          type: number
      - name: sort
        required: false
        in: query
        description: Sort by param, it can be one param or a list of params separated by comma
        schema:
          type: array
          items:
            type: string
            enum:
            - collection.name
            - name
            - blockchainDescriptor
      - name: order
        required: false
        in: query
        description: Order direction, it can be `ASC` for ascending or `DESC` for descending
        schema:
          default: ASC
          enum:
          - DESC
          - ASC
          type: string
      responses:
        '200':
          description: ''
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetNFTsResponse'
      tags:
