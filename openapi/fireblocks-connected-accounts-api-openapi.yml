          name: Fireblocks SDK Python example
      x-codeSamples:
      - lang: TypeScript
        source: 'const response: Promise<FireblocksResponse<ConnectedAccountBalancesResponse>> = fireblocks.connectedAccounts.getConnectedAccountBalances(connectedAccountsApiGetConnectedAccountBalancesRequest);'
      - lang: Java
        source: CompletableFuture<ApiResponse<ConnectedAccountBalancesResponse>> response = fireblocks.connectedAccounts().getConnectedAccountBalances(accountId, pageSize, pageCursor);
      - lang: Python
        source: response = fireblocks.connected_accounts.get_connected_account_balances(account_id, page_size, page_cursor);
  /connected_accounts/{accountId}/credentials:
    post:
      tags:
      - Connected Accounts
      x-rate-limit-category: write
      summary: Update connected account credentials
      description: 'Replace the API credentials (secret + API key) of a connected account.


        Credentials belong to an API key, which can back a single account or an entire hierarchy.

        Updating them affects all accounts sharing that key, so the endpoint returns an array of modified accounts.


        The `creds` field must be a Base64-encoded RSA-encrypted credential blob; use

        `GET /connected_accounts/credentials/public_key` to retrieve the public key for encryption.

        Both `creds` and `apiKey` are mandatory.


        Validation against the exchange is synchronous, but the update itself is **pending mobile

        approval** — the existing credentials stay live until the change is approved, so none of the

        affected accounts are disconnected in the meantime.


        Endpoint Permission: Admin, Non-Signing Admin.'
      operationId: updateConnectedAccountCredentials
      parameters:
      - name: accountId
        in: path
        required: true
        description: The unique identifier of the connected account whose API key credentials are being replaced.
        schema:
          type: string
          minLength: 1
        example: 2c96e3aa-07ca-4524-a026-75579d25e24a
      - $ref: '#/components/parameters/X-Idempotency-Key'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateConnectedAccountCredentialsRequest'
      responses:
        '201':
          description: Credential update initiated (pending approval).
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateConnectedAccountCredentialsResponse'
        '400':
          description: Bad request — credentials cannot be updated on a sub-account, or missing creds / apiKey.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectedAccountErrorResponse'
        '403':
          description: Insufficient permissions, or feature not enabled for this tenant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectedAccountErrorResponse'
        '404':
          description: Connected account not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectedAccountErrorResponse'
        '409':
          description: Account is not in an updatable state, or the credentials belong to a different account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectedAccountErrorResponse'
        '422':
          description: The provided credentials were rejected by the exchange.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectedAccountErrorResponse'
        default:
          $ref: '#/components/responses/Error'
      x-readme:
        code-samples:
        - language: typescript
          code: 'const response: Promise<FireblocksResponse<UpdateConnectedAccountCredentialsResponse>> = fireblocks.connectedAccounts.updateConnectedAccountCredentials(connectedAccountsApiUpdateConnectedAccountCredentialsRequest);'
          name: Fireblocks SDK TypeScript example
        - language: java
          code: CompletableFuture<ApiResponse<UpdateConnectedAccountCredentialsResponse>> response = fireblocks.connectedAccounts().updateConnectedAccountCredentials(updateConnectedAccountCredentialsRequest, accountId, idempotencyKey);
          name: Fireblocks SDK Java example
        - language: python
          code: response = fireblocks.connected_accounts.update_connected_account_credentials(update_connected_account_credentials_request, account_id, idempotency_key);
          name: Fireblocks SDK Python example
      x-codeSamples:
      - lang: TypeScript
        source: 'const response: Promise<FireblocksResponse<UpdateConnectedAccountCredentialsResponse>> = fireblocks.connectedAccounts.updateConnectedAccountCredentials(connectedAccountsApiUpdateConnectedAccountCredentialsRequest);'
      - lang: Java
        source: CompletableFuture<ApiResponse<UpdateConnectedAccountCredentialsResponse>> response = fireblocks.connectedAccounts().updateConnectedAccountCredentials(updateConnectedAccountCredentialsRequest, accountId, idempotencyKey);
      - lang: Python
        source: response = fireblocks.connected_accounts.update_connected_account_credentials(update_connected_account_credentials_request, account_id, idempotency_key);
  /connected_accounts/{accountId}/manifest/capabilities/trading/pairs:
