          code: 'const response: Promise<FireblocksResponse<ConnectedAccountBalancesResponse>> = fireblocks.connectedAccounts.getConnectedAccountBalances(connectedAccountsApiGetConnectedAccountBalancesRequest);'
          name: Fireblocks SDK TypeScript example
        - language: java
          code: CompletableFuture<ApiResponse<ConnectedAccountBalancesResponse>> response = fireblocks.connectedAccounts().getConnectedAccountBalances(accountId, pageSize, pageCursor);
          name: Fireblocks SDK Java example
        - language: python
