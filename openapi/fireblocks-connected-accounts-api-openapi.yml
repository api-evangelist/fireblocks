  /connected_accounts/{accountId}/rename:
    post:
      tags:
      - Connected Accounts
      x-rate-limit-category: write
      summary: Rename Connected Account
      description: Rename a connected account by account ID.
      operationId: renameConnectedAccount
      parameters:
      - name: accountId
        in: path
        required: true
        description: The unique identifier of the connected account
        schema:
          type: string
          minLength: 1
      - $ref: '#/components/parameters/X-Idempotency-Key'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenameConnectedAccountRequest'
      responses:
        '200':
          description: Successfully renamed connected account.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RenameConnectedAccountResponse'
        '400':
          description: Bad request. Missing tenantId, accountId, or accountName.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectedAccountErrorResponse'
        '401':
          description: Unauthorized. Missing / invalid JWT token in Authorization header.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectedAccountErrorResponse'
        '403':
          description: Failed to rename connected account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectedAccountErrorResponse'
        '404':
          description: Connected account not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectedAccountErrorResponse'
        '409':
          description: Conflict. Account name is already in use by another account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectedAccountErrorResponse'
        default:
          $ref: '#/components/responses/Error'
      x-readme:
        code-samples:
        - language: typescript
          code: 'const response: Promise<FireblocksResponse<RenameConnectedAccountResponse>> = fireblocks.connectedAccounts.renameConnectedAccount(connectedAccountsApiRenameConnectedAccountRequest);'
          name: Fireblocks SDK TypeScript example
        - language: java
          code: CompletableFuture<ApiResponse<RenameConnectedAccountResponse>> response = fireblocks.connectedAccounts().renameConnectedAccount(renameConnectedAccountRequest, accountId, idempotencyKey);
          name: Fireblocks SDK Java example
        - language: python
          code: response = fireblocks.connected_accounts.rename_connected_account(rename_connected_account_request, account_id, idempotency_key);
          name: Fireblocks SDK Python example
      x-codeSamples:
      - lang: TypeScript
        source: 'const response: Promise<FireblocksResponse<RenameConnectedAccountResponse>> = fireblocks.connectedAccounts.renameConnectedAccount(connectedAccountsApiRenameConnectedAccountRequest);'
      - lang: Java
        source: CompletableFuture<ApiResponse<RenameConnectedAccountResponse>> response = fireblocks.connectedAccounts().renameConnectedAccount(renameConnectedAccountRequest, accountId, idempotencyKey);
      - lang: Python
        source: response = fireblocks.connected_accounts.rename_connected_account(rename_connected_account_request, account_id, idempotency_key);
