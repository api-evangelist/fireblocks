openapi: 3.2.0
info:
  title: Fireblocks Connected Accounts API
  description: 'Fireblocks provides a suite of applications to manage digital asset operations and a complete development platform to build your business on the blockchain.


    - Visit our website for more information: Fireblocks Website

    - Visit our developer docs: Fireblocks DevPortal'
  version: 1.6.2
  contact:
    email: developers@fireblocks.com
servers:
- url: https://api.fireblocks.io/v1
  description: Fireblocks Production Environment Base URL
- url: https://sandbox-api.fireblocks.io/v1
  description: Fireblocks Sandbox Environment Base URL
tags:
- name: Connected Accounts
paths:
  /connected_accounts:
    get:
      summary: Get connected accounts
      description: Returns all connected accounts.
      tags:
      - Connected Accounts
      x-rate-limit-category: query
      parameters:
      - name: mainAccounts
        in: query
        required: false
        description: Whether to include only main accounts in the response.
        schema:
          type: boolean
          default: false
      - name: pageSize
        in: query
        required: false
        description: Page size for pagination.
        schema:
          type: integer
          minimum: 1
          maximum: 100
      - name: pageCursor
        in: query
        required: false
        description: Page cursor for pagination.
        schema:
          type: string
      operationId: getConnectedAccounts
      responses:
        '200':
          description: Get accounts response
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectedAccountsResponse'
        default:
          $ref: '#/components/responses/Error'
      x-readme:
        code-samples:
        - language: typescript
          code: 'const response: Promise<FireblocksResponse<ConnectedAccountsResponse>> = fireblocks.connectedAccounts.getConnectedAccounts(connectedAccountsApiGetConnectedAccountsRequest);'
          name: Fireblocks SDK TypeScript example
        - language: java
          code: CompletableFuture<ApiResponse<ConnectedAccountsResponse>> response = fireblocks.connectedAccounts().getConnectedAccounts(mainAccounts, pageSize, pageCursor);
          name: Fireblocks SDK Java example
        - language: python
          code: response = fireblocks.connected_accounts.get_connected_accounts(main_accounts, page_size, page_cursor);
          name: Fireblocks SDK Python example
      x-codeSamples:
      - lang: TypeScript
        source: 'const response: Promise<FireblocksResponse<ConnectedAccountsResponse>> = fireblocks.connectedAccounts.getConnectedAccounts(connectedAccountsApiGetConnectedAccountsRequest);'
      - lang: Java
        source: CompletableFuture<ApiResponse<ConnectedAccountsResponse>> response = fireblocks.connectedAccounts().getConnectedAccounts(mainAccounts, pageSize, pageCursor);
      - lang: Python
        source: response = fireblocks.connected_accounts.get_connected_accounts(main_accounts, page_size, page_cursor);
    post:
      summary: Add a connected account
      description: 'Creates a new connected account for the authenticated tenant.


        The `creds` field must be a Base64-encoded RSA-encrypted credential blob.

        Use `GET /connected_accounts/credentials/public_key` to retrieve the public key for encryption.


        The `providerType` is derived server-side from the `providerId` — callers do not supply it.


        Endpoint Permission: Editor, Admin, Non-Signing Admin.'
      tags:
      - Connected Accounts
      x-rate-limit-category: write
      operationId: addConnectedAccount
      parameters:
      - $ref: '#/components/parameters/X-Idempotency-Key'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddConnectedAccountRequest'
      responses:
        '201':
          description: Account created (or pending approval).
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddConnectedAccountResponse'
        '400':
          description: Bad request — invalid field or provider constraints violated.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectedAccountErrorResponse'
        '401':
          description: Unauthorized. Missing / invalid JWT token, or insufficient role (Editor or higher required).
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectedAccountErrorResponse'
        '403':
          description: Feature not enabled for this tenant.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectedAccountErrorResponse'
        '404':
          description: mainAccountId not found.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectedAccountErrorResponse'
        '422':
          description: Invalid credentials.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectedAccountErrorResponse'
        default:
          $ref: '#/components/responses/Error'
      x-readme:
        code-samples:
        - language: typescript
          code: 'const response: Promise<FireblocksResponse<AddConnectedAccountResponse>> = fireblocks.connectedAccounts.addConnectedAccount(connectedAccountsApiAddConnectedAccountRequest);'
          name: Fireblocks SDK TypeScript example
        - language: java
          code: CompletableFuture<ApiResponse<AddConnectedAccountResponse>> response = fireblocks.connectedAccounts().addConnectedAccount(addConnectedAccountRequest, idempotencyKey);
          name: Fireblocks SDK Java example
        - language: python
          code: response = fireblocks.connected_accounts.add_connected_account(add_connected_account_request, idempotency_key);
          name: Fireblocks SDK Python example
      x-codeSamples:
      - lang: TypeScript
        source: 'const response: Promise<FireblocksResponse<AddConnectedAccountResponse>> = fireblocks.connectedAccounts.addConnectedAccount(connectedAccountsApiAddConnectedAccountRequest);'
      - lang: Java
        source: CompletableFuture<ApiResponse<AddConnectedAccountResponse>> response = fireblocks.connectedAccounts().addConnectedAccount(addConnectedAccountRequest, idempotencyKey);
      - lang: Python
        source: response = fireblocks.connected_accounts.add_connected_account(add_connected_account_request, idempotency_key);
  /connected_accounts/{accountId}:
    get:
