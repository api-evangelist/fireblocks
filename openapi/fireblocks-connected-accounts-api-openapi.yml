      - Connected Accounts
      x-rate-limit-category: read
      parameters:
      - name: accountId
        in: path
        required: true
        description: The ID of the account to fetch.
        schema:
          type: string
          minLength: 1
      summary: Get connected account
      description: Retrieve detailed information about a specific connected account by ID.
      operationId: getConnectedAccount
      responses:
        '200':
          description: Account response
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectedSingleAccountResponse'
        default:
          $ref: '#/components/responses/Error'
      x-readme:
        code-samples:
        - language: typescript
          code: 'const response: Promise<FireblocksResponse<ConnectedSingleAccountResponse>> = fireblocks.connectedAccounts.getConnectedAccount(connectedAccountsApiGetConnectedAccountRequest);'
          name: Fireblocks SDK TypeScript example
        - language: java
          code: CompletableFuture<ApiResponse<ConnectedSingleAccountResponse>> response = fireblocks.connectedAccounts().getConnectedAccount(accountId);
          name: Fireblocks SDK Java example
        - language: python
          code: response = fireblocks.connected_accounts.get_connected_account(account_id);
          name: Fireblocks SDK Python example
      x-codeSamples:
      - lang: TypeScript
        source: 'const response: Promise<FireblocksResponse<ConnectedSingleAccountResponse>> = fireblocks.connectedAccounts.getConnectedAccount(connectedAccountsApiGetConnectedAccountRequest);'
      - lang: Java
        source: CompletableFuture<ApiResponse<ConnectedSingleAccountResponse>> response = fireblocks.connectedAccounts().getConnectedAccount(accountId);
      - lang: Python
        source: response = fireblocks.connected_accounts.get_connected_account(account_id);
    delete:
      tags:
      - Connected Accounts
      x-rate-limit-category: write
      summary: Disconnect connected account
      description: Disconnect a connected account by ID.
      parameters:
      - name: accountId
        in: path
        required: true
        description: The ID of the account to disconnect.
        schema:
          type: string
          minLength: 1
      operationId: disconnectConnectedAccount
      responses:
        '204':
          description: Account disconnected successfully
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
        default:
          $ref: '#/components/responses/Error'
      x-readme:
        code-samples:
        - language: typescript
          code: 'const response: Promise<FireblocksResponse<void>> = fireblocks.connectedAccounts.disconnectConnectedAccount(connectedAccountsApiDisconnectConnectedAccountRequest);'
          name: Fireblocks SDK TypeScript example
        - language: java
          code: CompletableFuture<ApiResponse<Void>> response = fireblocks.connectedAccounts().disconnectConnectedAccount(accountId);
          name: Fireblocks SDK Java example
        - language: python
          code: response = fireblocks.connected_accounts.disconnect_connected_account(account_id);
          name: Fireblocks SDK Python example
      x-codeSamples:
      - lang: TypeScript
        source: 'const response: Promise<FireblocksResponse<void>> = fireblocks.connectedAccounts.disconnectConnectedAccount(connectedAccountsApiDisconnectConnectedAccountRequest);'
      - lang: Java
        source: CompletableFuture<ApiResponse<Void>> response = fireblocks.connectedAccounts().disconnectConnectedAccount(accountId);
      - lang: Python
        source: response = fireblocks.connected_accounts.disconnect_connected_account(account_id);
  /connected_accounts/{accountId}/allowlist:
    get:
      summary: Get allowlist for connected account
      description: 'Retrieves the address allowlist for a specified connected account.


        **Note:** Currently supports CoinbaseExchange/Binance accounts only.'
      tags:
      - Connected Accounts
      x-rate-limit-category: query
      parameters:
      - name: accountId
        in: path
        required: true
        description: The connected account identifier
        schema:
          type: string
      - name: status
        in: query
        required: false
        description: Filter by allowlist entry status
        schema:
          $ref: '#/components/schemas/AllowlistEntryStatus'
      - name: assetId
        in: query
        required: false
        description: 'Filter by Fireblocks asset ID.


          See [List assets](https://developers.fireblocks.com/reference/listassets) for the canonical list of Fireblocks asset IDs.

          '
        schema:
          type: string
      - name: networkId
        in: query
        required: false
        description: 'Filter by Fireblocks network ID.


          See [List blockchains](https://developers.fireblocks.com/reference/listblockchains) for the canonical list of Fireblocks blockchain identifiers.

          '
        schema:
          type: string
      - name: address
        in: query
        required: false
        description: Filter by specific address
        schema:
          type: string
      - name: pageCursor
        in: query
        required: false
        description: Pagination cursor for next page
        schema:
          type: string
      - name: pageSize
        in: query
        required: false
        description: Maximum number of entries to return
        schema:
          type: integer
          minimum: 1
          maximum: 1000
      - name: order
        in: query
        required: false
        description: Sort order (ASC or DESC).
        schema:
          type: string
          default: DESC
          example: ASC
          enum:
          - ASC
          - DESC
      operationId: getConnectedAccountAllowlist
      responses:
        '200':
          description: Allowlist entries response
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AllowlistResponse'
        '404':
          description: Connected account not found
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectedAccountErrorResponse'
        default:
          $ref: '#/components/responses/Error'
      x-readme:
        code-samples:
        - language: typescript
          code: 'const response: Promise<FireblocksResponse<AllowlistResponse>> = fireblocks.connectedAccounts.getConnectedAccountAllowlist(connectedAccountsApiGetConnectedAccountAllowlistRequest);'
          name: Fireblocks SDK TypeScript example
        - language: java
          code: CompletableFuture<ApiResponse<AllowlistResponse>> response = fireblocks.connectedAccounts().getConnectedAccountAllowlist(accountId, status, assetId, networkId, address, pageCursor, pageSize, order);
          name: Fireblocks SDK Java example
        - language: python
          code: response = fireblocks.connected_accounts.get_connected_account_allowlist(account_id, status, asset_id, network_id, address, page_cursor, page_size, order);
          name: Fireblocks SDK Python example
      x-codeSamples:
      - lang: TypeScript
        source: 'const response: Promise<FireblocksResponse<AllowlistResponse>> = fireblocks.connectedAccounts.getConnectedAccountAllowlist(connectedAccountsApiGetConnectedAccountAllowlistRequest);'
      - lang: Java
        source: CompletableFuture<ApiResponse<AllowlistResponse>> response = fireblocks.connectedAccounts().getConnectedAccountAllowlist(accountId, status, assetId, networkId, address, pageCursor, pageSize, order);
      - lang: Python
        source: response = fireblocks.connected_accounts.get_connected_account_allowlist(account_id, status, asset_id, network_id, address, page_cursor, page_size, order);
  /connected_accounts/{accountId}/allowlist/{allowlistId}:
