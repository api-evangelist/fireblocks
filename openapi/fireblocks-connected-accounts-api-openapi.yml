          description: Allowlist entry response
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AllowlistEntryResponse'
        '404':
          description: Connected account or allowlist entry not found
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectedAccountErrorResponse'
        default:
          $ref: '#/components/responses/Error'
      x-readme:
        code-samples:
        - language: typescript
          code: 'const response: Promise<FireblocksResponse<AllowlistEntryResponse>> = fireblocks.connectedAccounts.getConnectedAccountAllowlistEntry(connectedAccountsApiGetConnectedAccountAllowlistEntryRequest);'
          name: Fireblocks SDK TypeScript example
        - language: java
          code: CompletableFuture<ApiResponse<AllowlistEntryResponse>> response = fireblocks.connectedAccounts().getConnectedAccountAllowlistEntry(accountId, allowlistId);
          name: Fireblocks SDK Java example
        - language: python
          code: response = fireblocks.connected_accounts.get_connected_account_allowlist_entry(account_id, allowlist_id);
          name: Fireblocks SDK Python example
      x-codeSamples:
      - lang: TypeScript
        source: 'const response: Promise<FireblocksResponse<AllowlistEntryResponse>> = fireblocks.connectedAccounts.getConnectedAccountAllowlistEntry(connectedAccountsApiGetConnectedAccountAllowlistEntryRequest);'
      - lang: Java
        source: CompletableFuture<ApiResponse<AllowlistEntryResponse>> response = fireblocks.connectedAccounts().getConnectedAccountAllowlistEntry(accountId, allowlistId);
      - lang: Python
        source: response = fireblocks.connected_accounts.get_connected_account_allowlist_entry(account_id, allowlist_id);
  /connected_accounts/{accountId}/allowlist/sync:
    post:
      summary: Sync allowlist for connected account
      description: 'Triggers an on-demand sync from the exchange, bypassing the cache and fetching live data immediately.


        **Rate limit:** 1 request per minute per connected account.


        **Note:** Currently supports CoinbaseExchange/Binance accounts only.'
      tags:
      - Connected Accounts
      x-rate-limit-category: async
      parameters:
      - $ref: '#/components/parameters/X-Idempotency-Key'
      - name: accountId
        in: path
        required: true
        description: The connected account identifier
        schema:
          type: string
      operationId: syncConnectedAccountAllowlist
      responses:
        '202':
          description: Sync request accepted and processing
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
        default:
          $ref: '#/components/responses/Error'
      x-readme:
        code-samples:
        - language: typescript
          code: 'const response: Promise<FireblocksResponse<void>> = fireblocks.connectedAccounts.syncConnectedAccountAllowlist(connectedAccountsApiSyncConnectedAccountAllowlistRequest);'
          name: Fireblocks SDK TypeScript example
        - language: java
          code: CompletableFuture<ApiResponse<Void>> response = fireblocks.connectedAccounts().syncConnectedAccountAllowlist(accountId, idempotencyKey);
          name: Fireblocks SDK Java example
        - language: python
          code: response = fireblocks.connected_accounts.sync_connected_account_allowlist(account_id, idempotency_key);
          name: Fireblocks SDK Python example
      x-codeSamples:
      - lang: TypeScript
        source: 'const response: Promise<FireblocksResponse<void>> = fireblocks.connectedAccounts.syncConnectedAccountAllowlist(connectedAccountsApiSyncConnectedAccountAllowlistRequest);'
      - lang: Java
        source: CompletableFuture<ApiResponse<Void>> response = fireblocks.connectedAccounts().syncConnectedAccountAllowlist(accountId, idempotencyKey);
      - lang: Python
        source: response = fireblocks.connected_accounts.sync_connected_account_allowlist(account_id, idempotency_key);
  /connected_accounts/{accountId}/balances:
