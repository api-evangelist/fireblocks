    CantonOfferResponseDetails:
      type: object
      description: 'The transaction belongs to an offer conversation: the offer itself, a response to it, or a leg that carries no answer of its own. The only block that changes over a transaction''s lifetime. An offer can have more than one response — an allocation offer is accepted and later withdrawn — so every response transaction states which answer it is in `responseType`.'
      example:
        version: 1
        domain: ALLOCATION
        responseType: ALLOCATION_WITHDRAW
        originalTransactionId: 9f2b7c14-8d55-4a02-b6e1-5c3f90a7d488
        allocationTransactionId: 5a1d8b0f-2c31-4c7e-9d0a-118e7b6c4a21
      properties:
        version:
          type: integer
          description: The shape of this block. Stamped at creation and never changed, so a reader always knows which version it is holding.
          example: 1
        domain:
          $ref: '#/components/schemas/CantonDomainEnum'
        vendor:
          $ref: '#/components/schemas/CantonVendorEnum'
        availableResponses:
          type: array
          description: 'The responses this offer accepts — copy one into `responseType` to answer it. Present on the offer only, set when it arrives and never changed: it states what the offer TYPE accepts, not whether it is answerable right now. The respond endpoint is the authority on that, and answers `409` when the offer''s state or expiry rules a response out — for example an `ALLOCATION_WITHDRAW` sent before the accept has settled. An empty array means nothing is answerable on this transaction — the difference between an actionable offer and a linked leg that shares its sub-status.'
          items:
            type: string
            description: A response type that may be sent for this offer.
            example: DTCC_END_INVESTOR_ONBOARDING_ACCEPT
          example:
          - DTCC_END_INVESTOR_ONBOARDING_ACCEPT
          - DTCC_END_INVESTOR_ONBOARDING_REJECT
        expiresAt:
          type: string
          format: date-time
          description: When the offer expires, where it has a deadline.
          example: '2026-12-31T23:59:59Z'
        approvalTransactionId:
          type: string
          description: The response transaction, once one has been dispatched for this offer.
          example: 2a7f4c31-9d08-4b52-8e6a-1f3c70b9d485
        originalTransactionId:
          type: string
          description: The transaction this one relates to — the offer a response answered.
          example: 9f2b7c14-8d55-4a02-b6e1-5c3f90a7d488
        responseType:
          type: string
          description: On a response transaction, which answer it is — the `responseType` that was sent. Absent on the offer itself.
          example: ALLOCATION_ACCEPT
        allocationTransactionId:
          type: string
          description: On an `ALLOCATION_WITHDRAW` response only — the accept whose allocation this withdraw released, so the withdraw transaction read on its own says what it undid.
          example: 5a1d8b0f-2c31-4c7e-9d0a-118e7b6c4a21
        verdict:
          type: string
          enum:
          - ACCEPTED
          - REJECTED
          description: The outcome, set once the transaction reaches a terminal status.
          example: ACCEPTED
    UtxoInput:
