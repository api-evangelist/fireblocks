    CantonDetails:
      type: object
      description: 'Canton transaction context. Present on transactions that belong to a Canton flow, and the authoritative signal that a transaction IS one — do not branch on `operation`, which is `CANTON_CALL` for customer-initiated calls but `TRANSFER` for an incoming Canton transfer offer. **No `cantonDetails` at all means the transaction is not a Canton item.**


        The service sets exactly one of `offerResponse`, `call` or `settlement`. That is a guarantee about what is sent, NOT a constraint this schema enforces: the three are declared as independent optional properties on purpose, so that a response carrying a block a client does not yet know about — or a row written before a block type existed — still validates. Response schemas here stay additive. Read the block you recognise; do not reject a payload for the shape of the others.


        Every block carries `version`, stamped when the transaction is created and never changed — a transaction written today keeps its shape, so `version` is how you know which shape you are reading.'
      example:
        offerResponse:
          version: 1
          domain: ALLOCATION
          responseType: ALLOCATION_WITHDRAW
          originalTransactionId: 9f2b7c14-8d55-4a02-b6e1-5c3f90a7d488
          allocationTransactionId: 5a1d8b0f-2c31-4c7e-9d0a-118e7b6c4a21
      properties:
        offerResponse:
          $ref: '#/components/schemas/CantonOfferResponseDetails'
        call:
          $ref: '#/components/schemas/CantonCallDetails'
        settlement:
          $ref: '#/components/schemas/CantonSettlementDetails'
