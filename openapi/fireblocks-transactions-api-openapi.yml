          example: QmVXXj5BJchhqQTU27uEkeghYMnxR6aVjZxJP9jS6uCg9Q
        legalPersonNameIdentifierType:
          type: string
          description: 'Specifies the type of name for a legal person (IVMS101 LegalPersonNameTypeCode). Acceptable values are: - ''LEGL'': Legal name - official name under which the organisation is registered. - ''SHRT'': Short name of the organisation. - ''TRAD'': Trading name - name used by the business for commercial purposes. The value must be encrypted.'
