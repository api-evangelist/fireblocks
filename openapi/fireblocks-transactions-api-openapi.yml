    UtxoSelectionParams:
      type: object
      description: 'For UTXO-based blockchains only. Controls which UTXOs are used for automatic selection. Cannot be used together with extraParameters.inputsSelection. This feature is currently in beta and might be subject to changes.

        '
      properties:
        selectionStrategy:
          type: string
