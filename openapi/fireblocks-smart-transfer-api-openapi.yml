components:
  parameters:
    X-Idempotency-Key:
      name: Idempotency-Key
      in: header
      description: A unique identifier for the request. If the request is sent multiple times with the same idempotency key, the server will return the same response as the first request. The idempotency key is valid for 24 hours.
      required: false
      schema:
        type: string
  schemas:
    ErrorSchema:
      type: object
      properties:
        message:
          type: string
        code:
          type: number
    SmartTransferCreateTicketTerm:
      type: object
      properties:
        asset:
          type: string
          description: Asset name
          example: BTC
          x-fb-entity: asset
        amount:
          type: string
          description: Amount
          example: '133.789161216184'
        fromNetworkId:
          type: string
          description: Identifier of the origination Network Profile
          example: 947c6115-1f5f-4fb4-9fd6-a1f9dee14670
        toNetworkId:
          type: string
          description: Identifier of the destination Network Profile
          example: 5d009697-c29b-48e0-aff8-1f4305d19dc2
      required:
      - asset
      - amount
      - fromNetworkId
      - toNetworkId
    SmartTransferCoinStatistic:
      type: object
      description: Smart transfer coin statistic
      properties:
        asset:
          type: string
          example: BTC
        amount:
          type: string
          example: 15
    SmartTransferUserGroups:
      type:
      - object
      - 'null'
      description: Data object with result data
      properties:
        userGroupIds:
          description: Data object with result data
          type:
          - array
          - 'null'
          items:
            type: string
      required:
      - userGroupIds
    SmartTransferTicketTermResponse:
      type: object
      properties:
        message:
          type:
          - string
          - 'null'
          description: Result message
          example: Success
        data:
          $ref: '#/components/schemas/SmartTransferTicketTerm'
      required:
      - message
    SmartTransferApproveTerm:
      type: object
      properties:
        asset:
          type: string
          description: Asset name
          example: USDC
          x-fb-entity: asset
        amount:
          type: string
          description: Amount
          example: '133.789161216184'
        srcId:
          type: string
          description: Id of the vault that is used as the source of the asset.
          example: '2'
        fee:
          type: string
          description: Transaction fee
          example: '0.001'
        feeLevel:
          type: string
          enum:
          - LOW
          - MEDIUM
          - HIGH
          description: Transaction fee level.
          example: MEDIUM
        note:
          type: string
          description: Transaction note
          example: Transaction note
      required:
      - asset
      - amount
      - srcId
    SmartTransferCreateTicket:
      type: object
      properties:
        createdByNetworkId:
          type: string
        type:
          type: string
          enum:
          - ASYNC
          - DVP
        expiresIn:
          type: number
          minimum: 1
          maximum: 48
          description: Number of hours after which an OPEN ticket will expire if no term is funded.
        terms:
          type: array
          items:
            $ref: '#/components/schemas/SmartTransferCreateTicketTerm'
        externalRefId:
          type: string
          maxLength: 64
        note:
          type: string
          maxLength: 1024
        submit:
          type: boolean
      required:
      - createdByNetworkId
      - type
    SmartTransferTicketResponse:
      type: object
      properties:
        message:
          type:
          - string
          - 'null'
          description: Result message
          example: Success
        data:
          $ref: '#/components/schemas/SmartTransferTicket'
      required:
      - message
    SmartTransferForbiddenResponse:
      type: object
      properties:
        message:
          type: string
          description: Forbidden error code
          example: You do not have permission to execute this action
        code:
          type: string
          description: Error code
          example: 3002
      required:
      - message
      - code
    SmartTransferNotFoundResponse:
      type: object
      properties:
        message:
          type: string
          description: Not found error message
          example: Requested entity not found
        code:
          type: string
          description: Error code
          example: c943bdb8-ada0-4ba6-8645-74fcf188a10f
      required:
      - message
      - code
    SmartTransferBadRequestResponse:
      type: object
      properties:
        message:
          type: string
          description: Bad request error message
          example: Your request contains invalid data
        code:
          type: string
          description: Bad request error code
          example: 2e7a7a5d-c85c-4ea5-9adf-668cba8b4eb4
      required:
      - message
      - code
    SmartTransferUserGroupsResponse:
      type: object
      properties:
        message:
          type:
          - string
          - 'null'
          description: Result message
          example: Success
        data:
          $ref: '#/components/schemas/SmartTransferUserGroups'
      required:
      - message
    SmartTransferManuallyFundTerm:
      type: object
      properties:
        txHash:
          type: string
          maxLength: 64
      required:
      - txHash
    SmartTransferUpdateTicketTerm:
      type: object
      properties:
        asset:
          type: string
          description: Asset name
          example: BTC
          x-fb-entity: asset
        amount:
          type: string
          description: Amount
          example: '133.789161216184'
        fromNetworkId:
          type: string
          description: Identifier of the origination Network Profile
          example: 947c6115-1f5f-4fb4-9fd6-a1f9dee14670
        toNetworkId:
          type: string
          description: Identifier of the destination Network Profile
          example: 5d009697-c29b-48e0-aff8-1f4305d19dc2
      required:
      - asset
      - amount
      - fromNetworkId
      - toNetworkId
    SmartTransferTicketTerm:
      type:
      - object
      - 'null'
      description: Data object with result data
      properties:
        id:
          type: string
          description: Unique id of Smart Transfer ticket term
          example: 84601ee2-b10f-4aa8-be9c-dba259a3533a
        ticketId:
          type: string
          description: Unique id of Smart Transfer ticket
          example: 900f04c3-83bc-428d-b681-aef682059637
        asset:
          type: string
          description: Asset name
          example: BTC
          x-fb-entity: asset
        amount:
          type: string
          description: Amount
          example: '133.789161216184'
