    ScreeningVerdictEnum:
      type: string
      description: 'The final verdict of the screening (unified for AML, Travel Rule, and TRLink).

        Different providers may return different verdict values:

        - AML: ACCEPT, REJECT, ALERT

        - Travel Rule: PASS, FAIL, TRAVEL_RULE_REQUIRED

        - TRLink: PASS, REJECT, WARN

        '
      enum:
      - PASS
      - FAIL
      - ALERT
      - REJECT
      - WARN
      - TRAVEL_RULE_REQUIRED
      - ACCEPT
      - REVIEW
      - WAIT
      example: PASS
