  /key_link/signing_keys/bulk/jobs/{jobId}:
    get:
      operationId: getBulkSigningKeysJob
      summary: Get a bulk registration job
      description: Returns the progress and outcome of a bulk registration job. `created + alreadyRegistered` reaching `total` means every submitted key is present.
      parameters:
      - name: jobId
        required: true
        in: path
        description: The id of the bulk registration job
        example: 46a92767-5f93-4a46-9eed-f012196bb4fc
        schema:
          type: string
      responses:
        '200':
          description: The bulk registration job
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkSigningKeyJob'
        default:
