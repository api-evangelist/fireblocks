openapi: 3.2.0
info:
  title: Fireblocks Earn API
  description: 'Fireblocks provides a suite of applications to manage digital asset operations and a complete development platform to build your business on the blockchain.


    - Visit our website for more information: Fireblocks Website

    - Visit our developer docs: Fireblocks DevPortal'
  version: 1.6.2
  contact:
    email: developers@fireblocks.com
servers:
- url: https://api.fireblocks.io/v1
  description: Fireblocks Production Environment Base URL
- url: https://sandbox-api.fireblocks.io/v1
  description: Fireblocks Sandbox Environment Base URL
tags:
- name: Earn
paths:
  /earn/actions:
    get:
      operationId: getEarnActions
      summary: List earn lending actions
      description: Returns a paginated list of lending actions (deposits and withdrawals) for the authenticated tenant.
      parameters:
      - name: pageCursor
        in: query
        required: false
        description: Cursor for the next or previous page of results.
        schema:
          type: string
      - name: pageSize
        in: query
        required: false
        description: Number of items per page (default 100, max 100).
        schema:
          type: integer
          format: int32
          default: 100
          minimum: 1
          maximum: 100
      - name: sortBy
        in: query
        required: false
        description: Field to sort results by.
        schema:
          type: string
          enum:
          - createdAt
          - updatedAt
      - name: order
        in: query
        required: false
        description: Sort order (ASC or DESC).
        schema:
          type: string
          default: DESC
          example: ASC
          enum:
          - ASC
          - DESC
      responses:
        '200':
          description: OK
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetActionsResponse'
        '403':
          description: 'Forbidden: insufficient permissions, disabled feature, or restricted access.'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorSchema'
        '404':
          description: 'Not found: requested resource does not exist.'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorSchema'
        '429':
          description: 'Rate limit exceeded: slow down and retry later.'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorSchema'
        '500':
          description: Internal error while processing the request.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorSchema'
        default:
          $ref: '#/components/responses/Error'
      tags:
      - Earn
      x-rate-limit-category: query
      x-readme:
        code-samples:
        - language: typescript
          code: 'const response: Promise<FireblocksResponse<GetActionsResponse>> = fireblocks.earn.getEarnActions(earnApiGetEarnActionsRequest);'
          name: Fireblocks SDK TypeScript example
        - language: java
          code: CompletableFuture<ApiResponse<GetActionsResponse>> response = fireblocks.earn().getEarnActions(pageCursor, pageSize, sortBy, order);
          name: Fireblocks SDK Java example
        - language: python
          code: response = fireblocks.earn.get_earn_actions(page_cursor, page_size, sort_by, order);
          name: Fireblocks SDK Python example
      x-codeSamples:
      - lang: TypeScript
        source: 'const response: Promise<FireblocksResponse<GetActionsResponse>> = fireblocks.earn.getEarnActions(earnApiGetEarnActionsRequest);'
      - lang: Java
        source: CompletableFuture<ApiResponse<GetActionsResponse>> response = fireblocks.earn().getEarnActions(pageCursor, pageSize, sortBy, order);
      - lang: Python
        source: response = fireblocks.earn.get_earn_actions(page_cursor, page_size, sort_by, order);
    post:
      operationId: createEarnAction
      summary: Create and execute a lending action (deposit or withdraw)
      description: 'Creates and runs a sequence of on-chain steps for either a deposit into or a withdrawal from an earn

        vault/market. Specify the operation with `action` in the request body (`DEPOSIT` or `WITHDRAW`).'
      parameters:
      - $ref: '#/components/parameters/X-Idempotency-Key'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEarnActionRequest'
      responses:
        '200':
          description: OK
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateEarnActionResponse'
        '400':
          description: 'Bad request: missing/invalid fields, unsupported amount, or malformed payload.'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorSchema'
        '403':
          description: 'Forbidden: insufficient permissions, disabled feature, or restricted provider.'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorSchema'
        '404':
          description: 'Not found: requested resource does not exist (e.g., opportunity, provider, or wallet).'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorSchema'
        '429':
          description: 'Rate limit exceeded: slow down and retry later.'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorSchema'
        '500':
          description: Internal error while processing the request.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorSchema'
        default:
          $ref: '#/components/responses/Error'
      tags:
      - Earn
      x-rate-limit-category: write
      x-readme:
        code-samples:
        - language: typescript
          code: 'const response: Promise<FireblocksResponse<CreateEarnActionResponse>> = fireblocks.earn.createEarnAction(earnApiCreateEarnActionRequest);'
          name: Fireblocks SDK TypeScript example
        - language: java
          code: CompletableFuture<ApiResponse<CreateEarnActionResponse>> response = fireblocks.earn().createEarnAction(createEarnActionRequest, idempotencyKey);
          name: Fireblocks SDK Java example
        - language: python
          code: response = fireblocks.earn.create_earn_action(create_earn_action_request, idempotency_key);
          name: Fireblocks SDK Python example
      x-codeSamples:
      - lang: TypeScript
        source: 'const response: Promise<FireblocksResponse<CreateEarnActionResponse>> = fireblocks.earn.createEarnAction(earnApiCreateEarnActionRequest);'
      - lang: Java
        source: CompletableFuture<ApiResponse<CreateEarnActionResponse>> response = fireblocks.earn().createEarnAction(createEarnActionRequest, idempotencyKey);
      - lang: Python
        source: response = fireblocks.earn.create_earn_action(create_earn_action_request, idempotency_key);
  /earn/actions/{id}:
