      description: Returns one lending action by its action sequence id (tenant-scoped).
      parameters:
      - name: id
        in: path
        required: true
        description: Action sequence id (UUID).
        schema:
          type: string
          minLength: 1
      responses:
        '200':
          description: OK
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetActionResponse'
        '403':
          description: 'Forbidden: insufficient permissions, disabled feature, or restricted access.'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorSchema'
        '404':
