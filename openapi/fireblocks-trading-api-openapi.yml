    TransferRail:
      type: string
      description: "Transfer rail: \n* **BLOCKCHAIN** - Transfer over the public blockchain\n* **INTERNAL** - Internal transfer within the same account (e.g. sub-accounts or same api key)\n* **SWIFT** - International wire transfer\n* **IBAN** - International Bank Account Number transfer\n* **US_WIRE** - Domestic wire transfer within the United States (e.g. FedWire)\n* **ACH** - Automated Clearing House transfer, typically takes longer but not as expensive as wire transfers\n* **SEPA** - Euro transfers within the SEPA zone\n* **SPEI** - Mexican interbank electronic payment system\n* **PIX** - Brazilian instant payment system\n* **LBT** - Local bank transfers\n* **MOMO** - Mobile money transfers (e.g. M-Pesa)\n* **CHAPS** - The Clearing House Automated Payment System (CHAPS) is a real-time gross settlement payment system used for transactions in the United Kingdom\n* **PAYID** - PayID payment identifier system (Australia)\n* **INTERAC** - Interac electronic funds transfer (Canada)\n* **INTERNAL_TRANSFER** - Internal transfer between accounts\n* **CIPS** - Cross-Border Interbank Payment System (China)\n* **NEQUI** - Nequi mobile payment (Colombia)\n* **FPS_UK** - UK Faster Payments (GBP)\n* **FPS_HK** - Hong Kong Faster Payment System (HKD)\n* **INSTA_PAY** - InstaPay instant payment (Philippines)\n* **PESONET** - PesoNet batch payment (Philippines)\n"
      enum:
      - BLOCKCHAIN
      - INTERNAL
      - SWIFT
      - IBAN
      - US_WIRE
      - ACH
      - SEPA
      - SPEI
      - PIX
      - LBT
      - MOMO
      - CHAPS
      - PAYID
      - INTERAC
      - INTERNAL_TRANSFER
      - CIPS
      - NEQUI
      - FPS_UK
      - FPS_HK
      - INSTA_PAY
      - PESONET
      example: BLOCKCHAIN
