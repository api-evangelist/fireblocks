        accountId: acc_5e9a2d1c4b7f3e8a
    FeePropertiesDetails:
      type: object
      properties:
        feeType:
          $ref: '#/components/schemas/FeeTypeEnum'
        assetId:
          type: string
          description: The asset identifier for the fee.
      required:
      - feeType
      - assetId
    AccountBasedAccessProvider:
      description: Provider integrated via Fireblocks connected accounts (`accountBased` is `true`).
      allOf:
      - $ref: '#/components/schemas/BaseProvider'
      - $ref: '#/components/schemas/AccountBasedAccessProviderInfo'
      example:
        id: BRIDGE
        name: Bridge
        logo: https://example.com/logos/bridge.png
        accountBased: true
        manifest:
          order:
            supported: true
            executionTypes:
            - MARKET
            settlementTypes:
            - DVP
          quote:
            supported: false
          rate:
            supported: true
        connected: true
        accounts:
        - id: acc_5e9a2d1c4b7f3e8a
          name: Main Trading Account
    ErrorSchema:
      type: object
      properties:
        message:
          type: string
        code:
          type: number
    PesonetDestination:
      type: object
      properties:
        type:
          type: string
          description: The transfer rail type for the destination
          enum:
          - PESONET
          example: PESONET
        address:
          $ref: '#/components/schemas/PesonetAddress'
      required:
      - type
      - address
    OrderRequirementSubmissionJsonSchema:
      type: string
      description: 'A JSON Schema (Draft-7) in string format describing the shape of the `data` object expected on the corresponding POST /trading/orders/{orderId}/requirement/data request. The schema is the contract: the client builds the `data` payload to match it, and SDKs can validate before sending. The string content is expected to be valid JSON (application/json).

        '
      example: "{\n  \"$schema\": \"http://json-schema.org/draft-07/schema#\",\n  \"type\": \"object\",\n  \"required\": [\"sourceOfFunds\", \"purposeOfPayment\"],\n  \"properties\": {\n    \"sourceOfFunds\": {\n      \"type\": \"string\",\n      \"enum\": [\"SALARY\", \"SAVINGS\", \"INVESTMENT_RETURNS\", \"BUSINESS_INCOME\", \"OTHER\"]\n    },\n    \"purposeOfPayment\": {\n      \"type\": \"string\",\n      \"enum\": [\"BUSINESS_EXPENSES\", \"PERSONAL_EXPENSES\", \"INVESTMENT\", \"OTHER\"]\n    }\n  }\n}\n"
    CreateOffersRequest:
      type: object
      properties:
        baseAssetId:
          type: string
          description: The source asset identifier.
          example: BTC
        baseAssetRail:
          $ref: '#/components/schemas/TransferRail'
        quoteAssetId:
          type: string
          description: The target asset identifier.
          example: USD
        quoteAssetRail:
          $ref: '#/components/schemas/TransferRail'
        baseAmount:
          type: string
          pattern: ^\d+(\.\d+)?$
          description: The amount to get offers for
          example: '100.00'
        slippageBps:
          type: integer
          description: Slippage tolerance in basis points (bps) for defi quotes - 1 is 0.01% and 10000 is 100%. If not set, defaults to 50 bps (0.5%).
          default: 50
          minimum: 1
          maximum: 10000
        settlement:
          $ref: '#/components/schemas/DVPSettlement'
        side:
          $ref: '#/components/schemas/Side'
      required:
      - baseAssetId
      - quoteAssetId
      - baseAmount
      - side
    DirectAccessProviderInfo:
      type: object
      properties:
        approved:
          type: boolean
          description: Whether the provider was approved for use
        hasTermsOfService:
          type: boolean
          description: Whether the provider has terms of service
        termsOfServiceUrl:
          type: string
          description: URL to the terms of service document
        privacyPolicyUrl:
          type: string
          description: URL to the privacy policy document
      required:
      - hasTermsOfService
    ChapsAddress:
      type: object
      required:
      - accountHolder
      - sortCode
      - accountNumber
      - bankAccountCountry
      - bankAccountHolderName
      properties:
        accountHolder:
          $ref: '#/components/schemas/AccountHolderDetails'
        sortCode:
          type: string
          description: UK bank sort code (format XX-XX-XX)
          example: 12-34-56
        accountNumber:
          type: string
          description: UK bank account number
          example: '12345678'
        bankName:
          type: string
          description: Name of the bank
          example: Barclays Bank
        bankAccountCountry:
          type: string
          pattern: ^\d{2}$
          description: CHAPS bank account holder name
          example: GB
        bankAccountHolderName:
          type: string
          pattern: ^(?=.{1,140}$)[^\s]+(\s+[^\s]+)*$
          example: John Smith
          description: CHAPS bank account holder name
      example:
        accountHolder:
          name: John Smith
          city: London
          country: GB
          subdivision: ENG
          address: 123 Oxford Street
          postalCode: W1D 1BS
        sortCode: 12-34-56
        accountNumber: '12345678'
        bankName: Barclays Bank
    AccessTypeResponse:
      description: Response-only counterpart of AccessType. Used by the `via` field of response schemas (Quote, Rate, OrderDetails, OrderSummary — and therefore QuoteOffer, RateOffer and Offer) so that the PROVIDER variant can expose `subProviders` without that field ever becoming reachable from a request body. Request schemas (CreateOrderRequest.via) keep using AccessType.
      discriminator:
        propertyName: type
        mapping:
          PROVIDER_ACCOUNT: '#/components/schemas/AccountAccessResponse'
          PROVIDER: '#/components/schemas/DirectAccessResponse'
      oneOf:
      - $ref: '#/components/schemas/AccountAccessResponse'
      - $ref: '#/components/schemas/DirectAccessResponse'
    Failure:
      type: object
      properties:
        reason:
          $ref: '#/components/schemas/FailureReason'
      required:
      - reason
    QuoteExecutionTypeDetails:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/QuoteExecutionTypeEnum'
        quoteId:
          type: string
          description: Quote ID for quote orders
        quoteAmount:
          type: string
          description: Quote amount for quote orders
      required:
      - type
      - quoteId
      - quoteAmount
    ExternalAccountLocalBankAfrica:
      type: object
      properties:
        successRedirectUrl:
          type: string
          description: URL to redirect the end user back to after they complete the payment on the bank/mobile provider page (e.g., the merchant checkout page)
    FixedAmountTypeEnum:
      type: string
      enum:
      - FIXED
      description: The type of amount for the fee, indicating a fixed amount.
    PersonalEntityTypeEnum:
      type: string
      enum:
      - INDIVIDUAL
    ExecutionStepType:
      type: string
      enum:
      - APPROVE
      - PERMIT
      - CONTRACT_CALL
      - EXECUTE
      - SETTLEMENT
      - DELIVERY
      example: EXECUTE
    TradingErrorSchema:
      type: object
      properties:
        message:
          type: string
        code:
          type: number
        descriptor:
          type: string
      required:
      - code
      - message
      example:
        code: 900
        message: 'Invalid base amount: must be greater than 0'
    PayidAddress:
      type: object
      required:
      - accountHolder
      - value
      - type
      properties:
        accountHolder:
          $ref: '#/components/schemas/AccountHolderDetails'
        value:
          type: string
          description: The PayID identifier (email, phone, ABN, or organization ID)
          example: john.williams@email.com
        type:
          type: string
          enum:
          - EMAIL
          description: The type of PayID being used
          example: EMAIL
        bsb:
          type: string
          description: Bank State Branch (BSB) number (6 digits, format XXX-XXX)
          example: 123-456
        accountNumber:
          type: string
          description: Australian bank account number
          example: '12345678'
      example:
        accountHolder:
          name: John Williams
          city: Sydney
          country: AU
          subdivision: NSW
          address: 456 George Street
          postalCode: '2000'
        value: john.williams@email.com
        type: EMAIL
        bsb: 123-456
        accountNumber: '12345678'
    DirectAccessProvider:
      description: Provider used without per-account linking (`accountBased` is `false`).
      allOf:
      - $ref: '#/components/schemas/BaseProvider'
      - $ref: '#/components/schemas/DirectAccessProviderInfo'
      example:
        id: UNISWAP_CLASSIC
        name: Uniswap Classic
        logo: https://example.com/logos/uniswap.png
        accountBased: false
        manifest:
          order:
            supported: true
            executionTypes:
            - MARKET
            - QUOTE
            settlementTypes:
            - DVP
          quote:
            supported: true
            settlementTypes:
            - DVP
          rate:
            supported: true
        approved: true
        hasTermsOfService: true
        termsOfServiceUrl: https://uniswap.org/terms
    DirectAccessResponse:
      description: Response-only counterpart of DirectAccess. Adds the server-populated `subProviders` field. Never use this schema in a request body — requests must keep using DirectAccess (via AccessType).
      allOf:
      - $ref: '#/components/schemas/DirectAccess'
      - $ref: '#/components/schemas/DirectAccessResponseInfo'
      example:
        type: PROVIDER
        providerId: uniswap-v3-provider
        subProviders:
        - lifi-relay
        - uniswap-v3
    SpeiDestination:
      type: object
      properties:
        type:
          type: string
          enum:
          - SPEI
        address:
          $ref: '#/components/schemas/SpeiAddress'
      required:
      - type
      - address
      example:
        type: SPEI
        address:
          accountHolder:
            name: Carlos Martinez Lopez
            city: Mexico City
            country: MX
            subdivision: CDMX
            address: Avenida Reforma 123
            postalCode: '06600'
          bankName: BBVA México
          bankAccountNumber: 012180001234567890
    PostalAddress:
      type: object
      properties:
        streetName:
          type: string
        buildingNumber:
          type: string
        postalCode:
          type: string
        city:
          type: string
        subdivision:
          type: string
        district:
          type: string
        country:
          type: string
      required:
      - streetName
      - buildingNumber
      - postalCode
      - city
      - subdivision
      - district
      - country
      example:
        streetName: Fifth Avenue
        buildingNumber: '350'
        postalCode: '10118'
        city: New York
        subdivision: NY
        district: Manhattan
        country: US
    OrderRequirementAllowedFileType:
      type: string
      description: Supported file formats for order requirement file uploads.
      enum:
      - PDF
      - JPEG
      - PNG
      - HEIC
      - HEIF
      - DOC
      - DOCX
      - XLS
      - XLSX
      - CSV
      example: PDF
    DirectAccess:
      type: object
      properties:
        type:
          type: string
          enum:
          - PROVIDER
          description: Indicates this uses direct provider access
        providerId:
          type: string
          description: The ID of the provider
      required:
      - type
      - providerId
      example:
        type: PROVIDER
        providerId: uniswap-v3-provider
    SwiftDestination:
      type: object
      properties:
        type:
          type: string
          enum:
          - SWIFT
        address:
          $ref: '#/components/schemas/SwiftAddress'
      required:
      - type
      - address
      example:
        type: SWIFT
        address:
          accountHolder:
            name: Pierre Dupont
            city: Paris
            country: FR
            subdivision: IDF
            address: 25 Avenue des Champs-Élysées
            postalCode: '75008'
          swiftCode: BNPAFRPPXXX
          routingNumber: '20041'
    LimitExecutionRequestDetails:
      allOf:
      - $ref: '#/components/schemas/LimitTypeDetails'
      - $ref: '#/components/schemas/ExecutionRequestBaseDetails'
      example:
        type: LIMIT
        price: '60000.00'
        timeInForce:
          type: FOK
        baseAssetId: USD
        quoteAssetId: BTC
        side: BUY
        baseAmount: '1000.00'
    BlockchainDestination:
      type: object
      properties:
        type:
          type: string
          description: The type of destination. Use "BLOCKCHAIN" for blockchain address destinations.
          example: BLOCKCHAIN
          enum:
          - BLOCKCHAIN
        address:
          $ref: '#/components/schemas/BlockchainAddress'
      required:
      - type
      - address
      example:
        type: BLOCKCHAIN
        address:
          blockchainAddress: '0x1234567890123456789012345678901234567890'
          tag: '1234567890'
    ExecutionStepError:
      type: string
      enum:
      - INTERNAL_ERROR
      - QUOTE_EXPIRED
      - INSUFFICIENT_OUTPUT_AMOUNT
      - INSUFFICIENT_FUNDS
      - LAST_TRANSACTION_FAILED
      - SWAP_APPROVAL_FAILED
      - PROVIDER_EXECUTION_ERROR
      example: INSUFFICIENT_FUNDS
    AccessType:
      discriminator:
        propertyName: type
        mapping:
          PROVIDER_ACCOUNT: '#/components/schemas/AccountAccess'
          PROVIDER: '#/components/schemas/DirectAccess'
      oneOf:
      - $ref: '#/components/schemas/AccountAccess'
      - $ref: '#/components/schemas/DirectAccess'
    ExternalAccountMobileMoney:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/ExternalAccountMobileMoneyType'
        mobilePhoneNumber:
          $ref: '#/components/schemas/MobilePhoneNumber'
        provider:
          $ref: '#/components/schemas/ExternalAccountMobileMoneyProvider'
        email:
          type: string
          format: email
        successRedirectUrl:
          type: string
          description: URL to redirect the end user back to after they complete the payment on the bank/mobile provider page (e.g., the merchant checkout page)
      required:
      - type
      - mobilePhoneNumber
      - provider
      - email
    ExecutionRequestDetailsType:
      type: string
      enum:
      - QUOTE
      - MARKET
      - LIMIT
      description: Execution type supported by the provider
    PrefundedSettlementType:
      type: string
      enum:
      - PREFUNDED
    ExternalAccountType:
      type: string
      enum:
      - EXTERNAL
    SettlementTypeEnum:
      type: string
      enum:
      - DVP
      - PREFUNDED
      - POST_TRADE
      description: Settlement type supported by the provider
    ExecutionRequestDetails:
      description: Order execution details
      discriminator:
        propertyName: type
        mapping:
          MARKET: '#/components/schemas/MarketExecutionRequestDetails'
          QUOTE: '#/components/schemas/QuoteExecutionWithRequoteRequestDetails'
          LIMIT: '#/components/schemas/LimitExecutionRequestDetails'
      oneOf:
      - $ref: '#/components/schemas/MarketExecutionRequestDetails'
      - $ref: '#/components/schemas/QuoteExecutionWithRequoteRequestDetails'
      - $ref: '#/components/schemas/LimitExecutionRequestDetails'
    TradingProvider:
      oneOf:
      - $ref: '#/components/schemas/AccountBasedAccessProvider'
      - $ref: '#/components/schemas/DirectAccessProvider'
    ReasonForPaymentEnum:
      type: string
      description: 'The reason or purpose of the payment. Used by providers (e.g. CPN) that require a categorical reason for cross-border payment compliance and reporting. Optional at the API level; runtime enforcement is handled by the calling service against the provider''s requirements.

        '
      enum:
      - INVOICE_PAYMENT
      - SERVICES_PAYMENT
      - SOFTWARE_PAYMENT
      - IMPORTED_GOODS_PAYMENT
      - TRAVEL_SERVICES
      - TRANSFER_TO_OWN_ACCOUNT
      - LOAN_REPAYMENT
      - PAYROLL
      - PROPERTY_RENTAL
      - INFORMATION_SERVICE_CHARGES
      - ADVERTISING_AND_PUBLIC_RELATIONS
      - INTELLECTUAL_PROPERTY_FEES
      - FINANCIAL_SERVICE_FEES
      - ADVISORY_AND_TECHNICAL_FEES
      - REPRESENTATIVE_OFFICE_EXPENSES
      - TAX_PAYMENT
      - GOODS_TRANSPORTATION_FEES
      - CONSTRUCTION_EXPENSES
      - INSURANCE_PREMIUM
      - GENERAL_GOODS_TRADE
      - INSURANCE_CLAIMS_PAYMENT
      - FAMILY_REMITTANCE
      - EDUCATION_EXPENSES
      - MEDICAL_TREATMENT
      - DONATIONS
      - MUTUAL_FUND_INVESTMENT
      - CURRENCY_EXCHANGE
      - ADVANCE_GOODS_PAYMENT
      - MERCHANT_SETTLEMENT
      - REPATRIATION_FUND_SETTLEMENT
      - CORPORATE_INVESTMENT
      - INTER_COMPANY_TRANSFER
      - OFFICE_OPERATING_EXPENSES
    QuotesResponse:
      type: object
      properties:
        quotes:
          type: array
          items:
            $ref: '#/components/schemas/Quote'
        quoteFailures:
          type: array
          description: List of partial failures encountered while requesting quotes. Empty when all quote attempts succeed.
          items:
            $ref: '#/components/schemas/ScopeItemFailure'
      required:
      - quotes
      - quoteFailures
      example:
        quotes:
        - via:
            type: PROVIDER_ACCOUNT
            providerId: bridge-provider-001
            accountId: acc_9f4e2d8b1c6a5e73
          id: quote_8f2e4d1a9c5b7e3f
          type: COMMITTED
          baseAssetId: USDC
          quoteAssetId: BTC
          baseAmount: '1000.00'
          quoteAmount: '0.02458'
          priceImpact: 0.005
          quoteMinAmount: '0.02450'
          expiresAt: '2024-01-15T10:35:00.000Z'
          executionSteps:
          - type: EXECUTE
            fee:
              feeType: ORDER
              assetId: USDC
              amountType: FIXED
              amount: '2.50'
          generalFees:
          - feeType: ORDER
            assetId: USDC
            amountType: FIXED
            amount: '2.50'
        quoteFailures:
        - providerId: BRIDGE
          accountId: acc_9f4e2d8b1c6a5e73
          error:
            code: 3107
            message: This trading pair is not supported by the provider.
        - providerId: UNISWAP
          error:
            code: 3101
            message: Provider not found.
            descriptor:
              providerId: UNISWAP
    CipsDestination:
      type: object
      properties:
        type:
          type: string
          description: The transfer rail type for the destination
          enum:
          - CIPS
          example: CIPS
        address:
          $ref: '#/components/schemas/CipsAddress'
        referenceId:
          type: string
          description: Optional payment reference
          example: INV-2024-0001
      required:
      - type
      - address
    USWireDestination:
      type: object
      properties:
        type:
          type: string
          enum:
          - WIRE
        address:
          $ref: '#/components/schemas/USWireAddress'
      required:
      - type
      - address
      example:
        type: WIRE
        address:
          accountHolder:
            name: John Smith
            city: New York
            country: US
            subdivision: NY
            address: 123 Wall Street
            postalCode: '10005'
          bankName: Chase Bank
          bankAccountNumber: '123456789012'
          routingNumber: '021000021'
          bankAddress: 270 Park Avenue, New York, NY 10017
    BusinessEntityTypeEnum:
      type: string
      enum:
      - BUSINESS
    NequiAddress:
      type: object
      required:
      - phone
      properties:
        phone:
          type: string
          description: Recipient phone number in E.164 format
          example: '+573001234567'
    PostTradeSettlement:
      type: object
      description: 'Nothing moves on-platform; settlement happens bilaterally, provider-side, after execution.

        '
      properties:
        type:
          $ref: '#/components/schemas/PostTradeSettlementType'
      required:
      - type
      example:
        type: POST_TRADE
    BpsFee:
      type: object
      properties:
        amountType:
          type: string
          enum:
          - BPS
        amount:
          type: number
          minimum: 0
          maximum: 10000
          description: Fee in basis points (1 = 0.01%, 10000 = 100%)
          example: 50
      required:
      - amountType
      - amount
      example:
        amountType: BPS
        amount: 50
    SwiftAddress:
      type: object
      properties:
        accountHolder:
          $ref: '#/components/schemas/AccountHolderDetails'
        swiftCode:
          $ref: '#/components/schemas/SwiftCode'
        routingNumber:
          type: string
          description: Routing number identifying the bank account.
      required:
      - accountHolder
      - swiftCode
      - routingNumber
      example:
        accountHolder:
          name: Emma Watson
          city: London
          country: GB
          subdivision: ENG
          address: 25 Bank Street, Canary Wharf
          postalCode: E14 5JP
        swiftCode: CHASUS33XXX
        routingNumber: 026009593
    SwiftCode:
      type: string
      pattern: ^[A-Z]{6}[A-Z0-9]{2}([A-Z0-9]{3})?$
      example: CHASUS33XXX
    QuoteOffer:
      allOf:
      - $ref: '#/components/schemas/Quote'
      - $ref: '#/components/schemas/QuoteOfferType'
    PostTradeSettlementType:
      type: string
      enum:
      - POST_TRADE
    MarketRequoteRequestDetails:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/MarketRequoteTypeEnum'
      required:
      - type
      example:
        type: MARKET
    Identification:
      discriminator:
        propertyName: entityType
        mapping:
          INDIVIDUAL: '#/components/schemas/PersonalIdentification'
          BUSINESS: '#/components/schemas/BusinessIdentification'
      oneOf:
      - $ref: '#/components/schemas/PersonalIdentification'
      - $ref: '#/components/schemas/BusinessIdentification'
    SettlementSourceAccount:
      discriminator:
        propertyName: type
        mapping:
          VAULT_ACCOUNT: '#/components/schemas/PlatformAccount'
          CONNECTED_ACCOUNT: '#/components/schemas/PlatformAccount'
          FIAT_ACCOUNT: '#/components/schemas/PlatformAccount'
          EXTERNAL: '#/components/schemas/ExternalAccount'
      oneOf:
      - $ref: '#/components/schemas/PlatformAccount'
      - $ref: '#/components/schemas/ExternalAccount'
  headers:
    X-Request-ID:
      schema:
        type: string
      description: Unique ID correlated to the API request. Please provide it in any support ticket you create or on Github issues related to Fireblocks SDKs
  responses:
    Error:
      description: Error Response
      headers:
        X-Request-ID:
          $ref: '#/components/headers/X-Request-ID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorSchema'
  parameters:
    X-Idempotency-Key:
      name: Idempotency-Key
      in: header
      description: A unique identifier for the request. If the request is sent multiple times with the same idempotency key, the server will return the same response as the first request. The idempotency key is valid for 24 hours.
      required: false
      schema:
        type: string
  securitySchemes:
    bearerTokenAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
x-readme:
  explorer-enabled: false
  samples-languages:
  - curl
  - javascript
  - python
