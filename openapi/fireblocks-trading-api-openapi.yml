components:
  schemas:
    MarketExecutionResponseDetails:
      allOf:
      - $ref: '#/components/schemas/MarketTypeDetails'
      - $ref: '#/components/schemas/ExecutionResponseBaseDetails'
      example:
        type: MARKET
        side: BUY
        baseAmount: '1000.00'
        baseAssetId: USDC
        baseAssetRail: BLOCKCHAIN
        quoteAssetId: BTC
        quoteAssetRail: BLOCKCHAIN
    LimitExecutionResponseDetails:
      allOf:
      - $ref: '#/components/schemas/LimitTypeDetails'
      - $ref: '#/components/schemas/ExecutionResponseBaseDetails'
      example:
        type: LIMIT
        price: '60000.00'
        timeInForce:
          type: FOK
        side: BUY
        baseAmount: '1000.00'
        baseAssetId: USDC
        baseAssetRail: BLOCKCHAIN
        quoteAssetId: BTC
        quoteAssetRail: BLOCKCHAIN
    FpsUkAddress:
      type: object
      required:
      - accountHolder
      - accountNumber
      - sortCode
      properties:
        accountHolder:
          $ref: '#/components/schemas/AccountHolderDetails'
        accountNumber:
          type: string
          description: UK bank account number
          example: '12345678'
        sortCode:
          type: string
          description: UK sort code (format XX-XX-XX)
          example: 12-34-56
    SourceOfFunds:
      type: object
      description: 'Information about the source and purpose of the funds being transacted. Used by providers that require additional context for compliance and reporting. Provide this field when the provider manifest indicates it is required.

        '
      properties:
        reasonForPayment:
          $ref: '#/components/schemas/ReasonForPaymentEnum'
      example:
        reasonForPayment: INVOICE_PAYMENT
    ParticipantsIdentification:
      description: KYC/AML participant identification
      type: object
      properties:
        originator:
          $ref: '#/components/schemas/Identification'
        beneficiary:
          $ref: '#/components/schemas/Identification'
      example:
        originator:
          externalReferenceId: user_123456
          entityType: INDIVIDUAL
          participantRelationshipType: FirstParty
          fullName:
            firstName: John
            lastName: Smith
          dateOfBirth: '1985-03-15'
          email: john.smith@example.com
          phone: '+14155551234'
          postalAddress:
            streetName: Main Street
            buildingNumber: '123'
            postalCode: '10001'
            city: New York
            subdivision: NY
            district: Manhattan
            country: US
        beneficiary:
          externalReferenceId: user_789012
          entityType: INDIVIDUAL
          participantRelationshipType: ThirdParty
          fullName:
            firstName: Alice
            lastName: Johnson
          dateOfBirth: '1990-07-22'
          email: alice.johnson@example.com
          phone: '+14155551234'
          postalAddress:
            streetName: Broadway
            buildingNumber: '456'
            postalCode: '10002'
            city: New York
            subdivision: NY
            district: Manhattan
            country: US
    InteracAddress:
      type: object
      description: "When true, funds are deposited directly into the recipient's bank account without a security question.\n When false, a security question and answer are required to complete the transfer"
      required:
      - accountHolder
      - recipientHandle
      - autoDeposit
      properties:
        accountHolder:
          $ref: '#/components/schemas/AccountHolderDetails'
        recipientHandle:
          $ref: '#/components/schemas/RecipientHandle'
        message:
          type: string
          description: The message to be sent to the recipient
          example: Please deposit the funds into the account
        autoDeposit:
          type: boolean
          description: Whether to automatically deposit the funds into the account
          example: true
        securityQuestion:
          type: string
          description: The security question to be used for the security answer
          example: What is your mother's maiden name?
        securityAnswer:
          type: string
          description: The security answer to be used for the security question
          example: Jane Smith
      example:
        accountHolder:
          name: John Smith
          city: Toronto
          country: CA
          subdivision: 'ON'
          address: 123 Yonge Street
          postalCode: M5B 1M4
        recipientHandle:
          type: EMAIL
          value: john.smith@email.com
        message: Please deposit the funds into the account
        autoDeposit: true
        securityQuestion: What is your mother's maiden name?
        securityAnswer: Jane Smith
    InternalTransferDestination:
      type: object
      properties:
        type:
          type: string
          enum:
          - INTERNAL_TRANSFER
        address:
          $ref: '#/components/schemas/InternalTransferAddress'
      required:
      - type
      example:
        type: INTERNAL_TRANSFER
        address:
          externalSubAccountId: sub_acc_1234567890
          accountId: acc_1234567890
    PayidDestination:
      type: object
      properties:
        type:
          type: string
          enum:
          - PAYID
        address:
          $ref: '#/components/schemas/PayidAddress'
      required:
      - type
      - address
      example:
        type: PAYID
        address:
          accountHolder:
            name: John Williams
            city: Sydney
            country: AU
            subdivision: NSW
            address: 456 George Street
            postalCode: '2000'
          payId: john.williams@email.com
          payIdType: email
          bsb: 123-456
          accountNumber: '12345678'
          bankName: Commonwealth Bank
    BlockchainTransfer:
      type: object
      properties:
        type:
          type: string
          enum:
          - BLOCKCHAIN
        txHash:
          type: string
          description: The hash of the transaction on the blockchain.
        amount:
          type: string
          description: The amount of the transaction.
      required:
      - amount
      example:
        type: BLOCKCHAIN
        txHash: '0x1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a6b7c8d9e0f1a2b'
        amount: '250.75'
    PaymentInstructions:
      oneOf:
      - $ref: '#/components/schemas/BlockchainDestination'
      - allOf:
        - $ref: '#/components/schemas/FiatDestination'
        - $ref: '#/components/schemas/FiatPaymentMetadata'
    FiatTransfer:
      type: object
      properties:
        type:
          type: string
          enum:
          - FIAT
        amount:
          type: string
          description: The amount of the fiat transfer.
        referenceId:
          type: string
          description: The reference ID for the fiat transfer.
      required:
      - amount
      example:
        type: FIAT
        amount: '750.25'
        referenceId: fiat_ref_2024_003_789
    FiatDestination:
      oneOf:
      - $ref: '#/components/schemas/IbanDestination'
      - $ref: '#/components/schemas/SwiftDestination'
      - $ref: '#/components/schemas/AchDestination'
      - $ref: '#/components/schemas/USWireDestination'
      - $ref: '#/components/schemas/SpeiDestination'
      - $ref: '#/components/schemas/SEPADestination'
      - $ref: '#/components/schemas/PixDestination'
      - $ref: '#/components/schemas/LocalBankTransferAfricaDestination'
      - $ref: '#/components/schemas/MobileMoneyDestination'
      - $ref: '#/components/schemas/EuropeanSEPADestination'
      - $ref: '#/components/schemas/ChapsDestination'
      - $ref: '#/components/schemas/InteracDestination'
      - $ref: '#/components/schemas/PayidDestination'
      - $ref: '#/components/schemas/InternalTransferDestination'
      - $ref: '#/components/schemas/CipsDestination'
      - $ref: '#/components/schemas/NequiDestination'
      - $ref: '#/components/schemas/FpsUkDestination'
      - $ref: '#/components/schemas/FpsHkDestination'
      - $ref: '#/components/schemas/InstaPayDestination'
      - $ref: '#/components/schemas/PesonetDestination'
    AccountHolderDetails:
      type: object
      properties:
        name:
          description: Full name of the account holder.
          type: string
        city:
          type: string
        country:
          description: Country code, as specified in ISO 3166-1 alpha-2.
          type: string
        subdivision:
          description: Country administrative subdivision, as specified in ISO 3166-2.
          type: string
        address:
          description: Account holder street address.
          type: string
        postalCode:
          type: string
      required:
      - name
      example:
        name: John Smith
        city: New York
        country: US
        subdivision: NY
        address: 123 Wall Street, Apt 4B
        postalCode: '10005'
    FeeTypeEnum:
      type: string
      enum:
      - ORDER
      - NETWORK
      - SPREAD
      - REBATE
      description: 'The type of fee, such as ORDER, NETWORK, or SPREAD. ORDER - Fee for executing the order. NETWORK - Fee for network transactions. SPREAD - Fee for the difference between buy and sell prices. REBATE - Negative fee returned to the user as a reward or incentive.

        '
    Iban:
      type: string
      pattern: ^[A-Z]{2}\d{2}[a-zA-Z0-9]{1,30}$
      example: GB82WEST12345698765432
    LocalBankAfricaAccountNumber:
      type: string
      pattern: ^\d{4,17}$
      example: '1234567890123'
    Quote:
      type: object
      description: A committed executable quote for a trading pair.
      properties:
        via:
          $ref: '#/components/schemas/AccessTypeResponse'
        id:
          type: string
          description: The unique identifier of the quote.
          example: quote_8f2e4d1a9c5b7e3f
        quoteAssetId:
          type: string
          description: The target asset identifier.
          example: USD
        quoteAssetRail:
          $ref: '#/components/schemas/TransferRail'
        baseAssetId:
          type: string
          description: The source asset identifier.
          example: BTC
        baseAssetRail:
          $ref: '#/components/schemas/TransferRail'
        baseAmount:
          type: string
          description: The amount of the base asset.
          example: '1000.00'
        quoteAmount:
          type: string
          description: The amount of the quote asset.
          example: '0.02458'
        priceImpact:
          type: number
          description: The estimated price impact as a decimal fraction.
          example: 0.005
        quoteMinAmount:
          type: string
          description: The minimum guaranteed amount of the quote asset.
          example: '0.02450'
        isSlippageApplied:
