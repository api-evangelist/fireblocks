  /trading/orders/{orderId}/requirement:
    get:
      operationId: getOrderRequirements
      summary: Get order requirement details for an order
      x-rate-limit-category: read
      tags:
      - Trading
      description: 'Fetch order requirement details for an order that is in `AWAITING_INFORMATION` status.


        The response includes `requirementId` and `dueBy` metadata, a

        `requiredData` JSON Schema (Draft-7) describing the shape of the `data` object expected on

        `POST /trading/orders/{orderId}/requirement/data`, and `requiredFiles` descriptors for any files the

        provider requires (uploaded via `POST /trading/orders/{orderId}/requirement/file`).


        Endpoint Permission: Owner, Admin, Non-Signing Admin, Signer, Approver, Editor, Viewer.


        For detailed information about error codes and troubleshooting, please refer to our API Error Codes documentation.'
      parameters:
      - name: orderId
        in: path
        required: true
        description: The ID of the order for which the order requirement is issued.
        schema:
          type: string
          minLength: 1
      responses:
        '200':
          description: Order requirement details
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderRequirementDetails'
        '401':
          description: Unauthorized. Missing / invalid JWT token in Authorization header.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TradingErrorSchema'
        '403':
          description: 'Forbidden: insufficient permissions, disabled feature, or restricted access.'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TradingErrorSchema'
        '404':
          description: 'Not found: the order does not exist.'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TradingErrorSchema'
        '409':
          description: 'Conflict: the order exists but does not have an active order requirement (e.g., the order is not in `AWAITING_INFORMATION`).'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TradingErrorSchema'
        '429':
          description: 'Rate limit exceeded: slow down and retry later.'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TradingErrorSchema'
        5XX:
          description: Internal error while processing the request.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TradingErrorSchema'
        default:
          $ref: '#/components/responses/Error'
      x-readme:
        code-samples:
        - language: typescript
          code: 'const response: Promise<FireblocksResponse<OrderRequirementDetails>> = fireblocks.trading.getOrderRequirements(tradingApiGetOrderRequirementsRequest);'
          name: Fireblocks SDK TypeScript example
        - language: java
          code: CompletableFuture<ApiResponse<OrderRequirementDetails>> response = fireblocks.trading().getOrderRequirements(orderId);
          name: Fireblocks SDK Java example
        - language: python
          code: response = fireblocks.trading.get_order_requirements(order_id);
          name: Fireblocks SDK Python example
      x-codeSamples:
      - lang: TypeScript
        source: 'const response: Promise<FireblocksResponse<OrderRequirementDetails>> = fireblocks.trading.getOrderRequirements(tradingApiGetOrderRequirementsRequest);'
      - lang: Java
        source: CompletableFuture<ApiResponse<OrderRequirementDetails>> response = fireblocks.trading().getOrderRequirements(orderId);
      - lang: Python
        source: response = fireblocks.trading.get_order_requirements(order_id);
  /trading/orders/{orderId}/requirement/data:
    post:
      operationId: submitOrderRequirements
      summary: Submit a response to an order requirement
      x-rate-limit-category: write
      tags:
      - Trading
      description: 'Submit the user''s textual response to an order requirement on an order that is in `AWAITING_INFORMATION` status.


        The request body carries `data` — a free-form object conforming to the `requiredData` JSON Schema

        returned by the GET endpoint. Any required files are uploaded separately via

        `POST /trading/orders/{orderId}/requirement/file`.


        Endpoint Permission: Owner, Admin, Non-Signing Admin, Signer, Editor.


        For detailed information about error codes and troubleshooting, please refer to our API Error Codes documentation.'
      parameters:
      - $ref: '#/components/parameters/X-Idempotency-Key'
      - name: orderId
        in: path
        required: true
        description: The ID of the order to submit the order requirement response for.
        schema:
          type: string
          minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitOrderRequirementRequest'
      responses:
        '202':
          description: Order requirement submission accepted for processing.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
        '400':
          description: 'Bad request: invalid input parameters, malformed request body, or validation failure.'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TradingErrorSchema'
        '401':
          description: Unauthorized. Missing / invalid JWT token in Authorization header.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TradingErrorSchema'
        '403':
          description: 'Forbidden: insufficient permissions, disabled feature, or restricted access.'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TradingErrorSchema'
        '404':
          description: 'Not found: the order does not exist.'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TradingErrorSchema'
        '409':
          description: 'Conflict: the order exists but does not have an active order requirement (e.g., the order is not in `AWAITING_INFORMATION`).'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TradingErrorSchema'
        '429':
          description: 'Rate limit exceeded: slow down and retry later.'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TradingErrorSchema'
        5XX:
          description: Internal error while processing the request.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TradingErrorSchema'
        default:
          $ref: '#/components/responses/Error'
      x-readme:
        code-samples:
        - language: typescript
          code: 'const response: Promise<FireblocksResponse<void>> = fireblocks.trading.submitOrderRequirements(tradingApiSubmitOrderRequirementsRequest);'
          name: Fireblocks SDK TypeScript example
        - language: java
          code: CompletableFuture<ApiResponse<Void>> response = fireblocks.trading().submitOrderRequirements(submitOrderRequirementRequest, orderId, idempotencyKey);
          name: Fireblocks SDK Java example
        - language: python
          code: response = fireblocks.trading.submit_order_requirements(submit_order_requirement_request, order_id, idempotency_key);
          name: Fireblocks SDK Python example
      x-codeSamples:
      - lang: TypeScript
        source: 'const response: Promise<FireblocksResponse<void>> = fireblocks.trading.submitOrderRequirements(tradingApiSubmitOrderRequirementsRequest);'
      - lang: Java
        source: CompletableFuture<ApiResponse<Void>> response = fireblocks.trading().submitOrderRequirements(submitOrderRequirementRequest, orderId, idempotencyKey);
      - lang: Python
        source: response = fireblocks.trading.submit_order_requirements(submit_order_requirement_request, order_id, idempotency_key);
  /trading/orders/{orderId}/requirement/file:
    post:
      operationId: uploadOrderRequirementFile
      summary: Upload a file for an order requirement
      x-rate-limit-category: write
      tags:
      - Trading
      description: 'Upload a single file (multipart/form-data) in response to an order requirement on an order that is in

        `AWAITING_INFORMATION` status. Call this endpoint once per required file.


        Send `fileKey` (matching a `fileKey` from `requiredFiles` on the GET response) and the binary `file`. Its type

        must be one of the supported file formats. Fireblocks encrypts each file and uploads it individually to the

        underlying provider. The textual response is submitted separately via

        `POST /trading/orders/{orderId}/requirement/data`.


        Endpoint Permission: Owner, Admin, Non-Signing Admin, Signer, Editor.


        For detailed information about error codes and troubleshooting, please refer to our API Error Codes documentation.'
      parameters:
      - $ref: '#/components/parameters/X-Idempotency-Key'
      - name: orderId
        in: path
        required: true
        description: The ID of the order to upload the order requirement file for.
        schema:
          type: string
          minLength: 1
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OrderRequirementFileUpload'
      responses:
        '202':
          description: File accepted for processing.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
        '400':
          description: 'Bad request: unsupported file type, missing fileKey, malformed request, or validation failure.'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TradingErrorSchema'
        '401':
          description: Unauthorized. Missing / invalid JWT token in Authorization header.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TradingErrorSchema'
        '403':
