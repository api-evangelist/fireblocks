components:
  schemas:
    NetworkConnectionResponse:
      type: object
      properties:
        id:
          type: string
        localChannel:
          allOf:
          - $ref: '#/components/schemas/NetworkChannel'
          deprecated: true
          description: Deprecated - Replaced by `localNetworkId`
        remoteChannel:
          allOf:
          - $ref: '#/components/schemas/NetworkChannel'
          deprecated: true
          description: Deprecated - Replaced by `remoteNetworkId`
        status:
          $ref: '#/components/schemas/NetworkConnectionStatus'
        localNetworkId:
          $ref: '#/components/schemas/NetworkId'
        remoteNetworkId:
          $ref: '#/components/schemas/NetworkId'
        routingPolicy:
          $ref: '#/components/schemas/NetworkConnectionRoutingPolicy'
      required:
      - id
      - localNetworkId
      - remoteNetworkId
      - routingPolicy
      - status
    CreateNetworkIdRequest:
      type: object
      properties:
        name:
          type: string
          description: Network ID Name
          example: My Network ID name
        routingPolicy:
          $ref: '#/components/schemas/NetworkIdRoutingPolicy'
      required:
      - name
    DeleteNetworkIdResponse:
      type: object
      properties:
        success:
          type: boolean
      required:
      - success
    SetNetworkIdRoutingPolicyRequest:
      type: object
      properties:
        routingPolicy:
          $ref: '#/components/schemas/NetworkIdRoutingPolicy'
      required:
      - routingPolicy
    DefaultNetworkRoutingDest:
      type: object
      properties:
        scheme:
          type: string
          description: The network routing logic.
          enum:
          - DEFAULT
      required:
      - scheme
    ThirdPartyRouting:
      type: object
      properties:
        isThirdPartyRouting:
          type: boolean
        description:
          type: string
    NetworkIdRoutingPolicy:
      type: object
      additionalProperties:
        oneOf:
        - $ref: '#/components/schemas/CustomRoutingDest'
        - $ref: '#/components/schemas/NoneNetworkRoutingDest'
    GetNetworkConnectionsResponse:
      type: array
      items:
        $ref: '#/components/schemas/NetworkConnectionResponse'
    SetNetworkIdDiscoverabilityRequest:
      type: object
      properties:
        isDiscoverable:
          type: boolean
      required:
      - isDiscoverable
    NetworkChannel:
      deprecated: true
      description: Deprecated in the only used reference - NetworkConnectionResponse
      type: object
      properties:
        networkId:
          type: string
        name:
          type: string
    NetworkConnectionStatus:
      type: string
      enum:
      - WAITING_FOR_APPROVAL
      - WAITING_FOR_PEER_APPROVAL
      - APPROVED
      - CANCELLED
      - FAILED
      - REJECTED
      - REJECTED_BY_PEER
      - REMOVED
      - REMOVED_BY_PEER
    SetNetworkIdResponse:
      type: object
      properties:
        success:
          type: boolean
      required:
      - success
    SetNetworkIdNameRequest:
      type: object
      properties:
        name:
          type: string
          description: Network ID name
          example: My Network ID name
      required:
      - name
    SetRoutingPolicyRequest:
      type: object
      properties:
        routingPolicy:
          $ref: '#/components/schemas/NetworkConnectionRoutingPolicy'
      required:
      - routingPolicy
    DeleteNetworkConnectionResponse:
      type: object
      properties:
        success:
          type: boolean
      required:
      - success
    NetworkConnection:
      type: object
      properties:
        localNetworkId:
          type: string
          description: The network ID of the profile trying to create the connection.
          example: 494ae5f7-7807-4bc5-863b-2963aa94398f
        remoteNetworkId:
          type: string
          description: The network ID the profile is attempting to connect to.
          example: ebde71be-30d6-4498-95c4-a151effdb377
        routingPolicy:
          $ref: '#/components/schemas/NetworkConnectionRoutingPolicy'
      required:
      - localNetworkId
      - remoteNetworkId
    GetRoutingPolicyAssetGroupsResponse:
      type: array
      items:
        type: string
    NetworkConnectionRoutingPolicy:
      type: object
      additionalProperties:
        oneOf:
        - $ref: '#/components/schemas/CustomRoutingDest'
        - $ref: '#/components/schemas/DefaultNetworkRoutingDest'
        - $ref: '#/components/schemas/NoneNetworkRoutingDest'
    NetworkIdResponse:
      allOf:
      - $ref: '#/components/schemas/NetworkId'
      - type: object
        properties:
          routingPolicy:
            $ref: '#/components/schemas/NetworkIdRoutingPolicy'
          isDiscoverable:
            type: boolean
            description: The specific network is discoverable.
    SearchNetworkIdsResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/NetworkIdResponse'
        next:
          type: string
    CustomRoutingDest:
      type: object
      properties:
        scheme:
          description: The network routing logic.
          type: string
          enum:
          - CUSTOM
        dstType:
          type: string
          description: The account the funds are being sent to.
          enum:
          - FIAT_ACCOUNT
          - VAULT
          - EXCHANGE
        dstId:
          type: string
          description: The ID of the account the funds are being sent to.
          example: 29a425f4-f621-4c01-a888-27adec7d1dfa
      required:
      - scheme
      - dstType
      - dstId
    NetworkId:
      type: object
      properties:
        id:
          type: string
          description: Network Connection ID
          example: 494ae5f7-7807-4bc5-863b-2963aa94398f
        name:
          type: string
          description: Network Connection Name
          example: My Network Connection Name
      required:
      - id
      - name
    GetNetworkIdsResponse:
      type: array
      items:
        allOf:
        - $ref: '#/components/schemas/NetworkIdResponse'
    SetRoutingPolicyResponse:
      type: object
      properties:
        success:
          type: boolean
      required:
      - success
    NoneNetworkRoutingDest:
      type: object
      properties:
        scheme:
          type: string
          description: No network routing logic.
          enum:
          - NONE
      required:
      - scheme
  responses:
    Error:
      description: Error Response
      headers:
        X-Request-ID:
          $ref: '#/components/headers/X-Request-ID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorSchema'
  parameters:
    X-Idempotency-Key:
      name: Idempotency-Key
      in: header
      description: A unique identifier for the request. If the request is sent multiple times with the same idempotency key, the server will return the same response as the first request. The idempotency key is valid for 24 hours.
      required: false
      schema:
        type: string
        example: some-unique-id
  securitySchemes:
    bearerTokenAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
