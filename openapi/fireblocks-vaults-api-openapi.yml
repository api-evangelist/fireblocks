components:
  schemas:
    UpdateAutomationSettingsRequest:
      type: object
      description: Request body for changing an existing USDC Gateway deposit automation.
      required:
      - timeBased
      properties:
        timeBased:
          $ref: '#/components/schemas/TimeBasedTrigger'
    VaultAccountsTagAttachmentOperationsResponse:
      type: object
      properties:
        appliedOperations:
          description: The operations that were applied
          type: array
          items:
            $ref: '#/components/schemas/VaultAccountTagAttachmentOperation'
        pendingOperations:
          description: The operations that are pending
          type: array
          items:
            $ref: '#/components/schemas/VaultAccountTagAttachmentPendingOperation'
        rejectedOperations:
          description: The operations that were rejected
          type: array
          items:
            $ref: '#/components/schemas/VaultAccountTagAttachmentRejectedOperation'
    UpdateVaultAccountRequest:
      type: object
      properties:
        name:
          description: Account Name
          type: string
    Tag:
      type: object
      properties:
        id:
          description: The unique identifier of the tag
          type: string
          format: uuid
          example: df4c0987-30da-4976-8dcf-bc2dd41ae331
        label:
          type: string
          description: The tag label
          example: VIP
        description:
          type: string
          description: Description for the tag
          example: Tag for VIP customers
        color:
          type: string
          description: The tag color in hex format
          example: '#FF5733'
        isProtected:
          type: boolean
          description: Indication if the tag is a protected tag
          default: false
        updatedAt:
          type: number
          description: The date and time the tag was last updated
          example: 1717084800000
        type:
          $ref: '#/components/schemas/TagType'
        allowedEntityTypes:
          type: array
          description: 'The entity types this tag may be attached to. Tags created before this field was introduced read back as [''vault_account'']. Known values: vault_account (default), contact.'
          minItems: 1
          items:
            type: string
          example:
          - vault_account
        pendingApprovalRequest:
          $ref: '#/components/schemas/ApprovalRequest'
      required:
      - id
      - label
      - isProtected
      - updatedAt
    AutomationSettingsRequest:
      type: object
      description: Request body for setting up a USDC Gateway deposit automation for a vault account.
      required:
      - automationType
      - timeBased
      properties:
        automationType:
          type: string
          enum:
          - USDC_GATEWAY_DEPOSIT
          description: The type of automation to configure.
          example: USDC_GATEWAY_DEPOSIT
        assetId:
          type: string
          description: The Fireblocks asset ID this automation applies to. Omit to cover all supported USDC Gateway assets.
          example: USDC_ETH
        timeBased:
          $ref: '#/components/schemas/TimeBasedTrigger'
    UsdcGatewayWalletInfoResponse:
      type: object
      required:
      - walletId
      - type
      - status
      - symbol
      - totalBalance
      - assets
      - virtualAssetId
      properties:
        walletId:
          type: string
          description: The USDC Gateway wallet identifier
          example: b68a9e08-b59c-4ff9-893f-52d4f78c21e6
        type:
          type: string
          description: The USDC Gateway provider identifier
          example: CIRCLEGATEWAY
        status:
          type: string
          enum:
          - ACTIVATED
          - DEACTIVATED
          description: Current activation status of the USDC Gateway wallet
          example: ACTIVATED
        symbol:
          type: string
          description: The token symbol supported by this wallet (e.g. USDC)
          example: USDC
        totalBalance:
          type: string
          description: Aggregate USDC balance across all assets
          example: '150'
        assets:
          type: array
          description: Per-chain USDC asset balances
          example:
          - id: USDC
            balance: '100'
            chain: Ethereum
            network: Mainnet
          items:
            $ref: '#/components/schemas/UsdcGatewayWalletAsset'
        virtualAssetId:
          type: string
          description: The id of the virtual asset
          example: 0e7e2ab4-544e-40aa-a7d2-93b6f6a1516e
    ApprovalRequest:
      type: object
      description: Approval request details
      properties:
        id:
          type: string
          format: numeric
          description: The approval request identifier
          example: '12345'
        type:
          type: string
          description: The approval request type
          enum:
          - TAG_UPDATE
          - TAG_DELETE
          - TAG_ATTACH_DETACH
        state:
          type: string
          description: The approval request state
          enum:
          - PENDING
          - APPROVED
          - REJECTED
          - FAILED
          - CANCELLED
          - EXPIRED
      required:
      - id
      - type
      - state
    ErrorSchema:
      type: object
      properties:
        message:
          type: string
        code:
          type: number
    UpdateVaultAccountAssetAddressRequest:
      type: object
      properties:
        description:
          description: The address description
          type: string
    JobCreated:
      type: object
      properties:
        jobId:
          type: string
        approvalRequestId:
          description: Approval request ID. Returned when a tag triggers an approval flow.
          type: string
    GetUnspentInputsResponse:
      type: array
      items:
        $ref: '#/components/schemas/UnspentInputsResponse'
    PaginatedAddressResponse:
      type: object
      properties:
        addresses:
          type: array
          items:
            $ref: '#/components/schemas/VaultWalletAddress'
        paging:
          type: object
          properties:
            before:
              description: A string representing a cursor. Users can use this with a new request to this API endpoint as the “before” request parameter to fetch the previous page of results.
              type: string
            after:
              description: A string representing a cursor. Users can use this with a new request to this API endpoint as the “after” request parameter to fetch the next page of results.
              type: string
    CreateVaultAssetResponse:
      type: object
      properties:
        id:
          type: string
        address:
          type: string
        legacyAddress:
          type: string
        enterpriseAddress:
          type: string
        tag:
          type: string
        eosAccountName:
          type: string
        status:
          type: string
        activationTxId:
          type: string
    VaultAccountTagAttachmentOperation:
      type: object
      properties:
        vaultAccountId:
          description: The ID of the vault account
          example: '1'
          type: string
          format: numeric
        tagId:
          description: Tag ID
          example: f0eebc99-9c0b-4ef8-bb6d-6bb9bd380a11
          type: string
          format: uuid
        action:
          $ref: '#/components/schemas/TagAttachmentOperationAction'
      required:
      - vaultAccountId
      - tagId
      - action
    TimeBasedTrigger:
      type: object
      description: The schedule for this deposit automation.
      required:
      - intervalValue
      - intervalUnit
      - balanceThreshold
      properties:
        intervalValue:
          type: integer
          minimum: 1
          description: How often the deposit runs, in units of intervalUnit.
          example: 60
        intervalUnit:
          type: string
          enum:
          - MINUTES
          - HOURS
          - DAYS
          description: The unit for intervalValue.
          example: MINUTES
        balanceThreshold:
          type: string
          pattern: ^\d+(\.\d+)?$
          description: Minimum USDC balance required before a deposit runs. Set to "0" to sweep the full available balance every time, with no minimum.
          example: '1000'
    GetVaultAccountAssetAddressesResponse:
      type: array
      items:
        $ref: '#/components/schemas/VaultWalletAddress'
    PublicKeyInformation:
      type: object
      properties:
        algorithm:
          type: string
          description: Elliptic Curve
          enum:
          - MPC_ECDSA_SECP256K1
          - MPC_EDDSA_ED25519
        derivationPath:
          example:
          - 44
          - 0
          - 0
          - 0
          - 0
          description: BIP44 derivation path
          type: array
          items:
            type: integer
        publicKey:
          description: Compressed/Uncompressed public key value in hex representation
          example: 1044c36403c1802818b472398f546a43a0d91569d5583a6e807c3825b155c7bd
          type: string
    CreateAddressResponse:
      type: object
      properties:
        address:
          type: string
        legacyAddress:
          type: string
        enterpriseAddress:
          type: string
        tag:
          type: string
        bip44AddressIndex:
          type: integer
    CreateVaultAccountRequest:
      type: object
      properties:
        name:
          description: Account Name
          type: string
        hiddenOnUI:
          description: Optional - if true, the created account and all related transactions will not be shown on Fireblocks console
          type: boolean
        customerRefId:
          description: Optional - Sets a customer reference ID
          type: string
        autoFuel:
          description: Optional - Sets the autoFuel property of the vault account
          type: boolean
        vaultType:
          default: MPC
          description: 'Type of vault account. The default type will be set to MPC.

            If the workspace does not support the selected type, it will return an error.

            '
          type: string
          enum:
          - MPC
          - KEY_LINK
        autoAssign:
          default: false
          description: 'Applicable only when the vault account type is KEY_LINK. For MPC, this parameter will be ignored.

            If set to true and there are available keys, random keys will be assigned to the newly created vault account.

            If set to true and there are no available keys to be assigned, it will return an error.

            If set to false, the vault account will be created without any keys.

            '
          type: boolean
    VaultAccountTagAttachmentPendingOperation:
      type: object
      properties:
        vaultAccountId:
          description: The ID of the vault account
          example: '1'
          type: string
          format: numeric
        tagId:
          description: Tag ID
          example: f0eebc99-9c0b-4ef8-bb6d-6bb9bd380a11
          type: string
          format: uuid
        action:
          $ref: '#/components/schemas/TagAttachmentOperationAction'
        approvalRequestId:
          description: Pending approval request ID
          example: '12345'
          type: string
      required:
      - vaultAccountId
      - tagId
      - action
      - approvalRequestId
    SaveAutomationSettingsResponse:
      type: object
      required:
      - automationId
      properties:
        automationId:
          type: string
          format: uuid
          description: The ID of the newly created deposit automation.
          example: b68a9e08-b59c-4ff9-893f-52d4f78c21e6
    CreateAssetsRequest:
      type: object
      properties:
        eosAccountName:
          description: Optional - when creating an EOS wallet, the account name. If not provided, a random name will be generated
          type: string
    GetVaultAccountsResponse:
      type: array
      items:
        $ref: '#/components/schemas/VaultAccount'
    GetAutomationSettingsResponse:
      type: object
      required:
      - settings
      properties:
        settings:
          type: array
          description: The deposit automations configured for the vault account.
          example:
          - automationId: b68a9e08-b59c-4ff9-893f-52d4f78c21e6
            vaultAccountId: '42'
            assetId: USDC_ETH
            automationType: USDC_GATEWAY_DEPOSIT
            timeBased:
              intervalValue: 60
              intervalUnit: MINUTES
          items:
            $ref: '#/components/schemas/AutomationSettingsResponse'
    AssetWallet:
      type: object
      properties:
        vaultId:
          description: ID of the vault account. You can [get the vault account by this ID](https://developers.fireblocks.com/reference/get_vault-accounts-vaultaccountid) to retrieve vault properties such as its name, auto fueling, hidden on UI or customer reference ID.
          type: string
        assetId:
          description: ID of the asset. You can get more information about this asset by using the [supported assets API](https://developers.fireblocks.com/reference/get_supported-assets)
          type: string
        available:
          description: Available balance, available to use in a transaction.
          type: string
        total:
          description: Total balance at the asset wallet, as seen at the blockchain explorers. This includes balance available, and any kind of unavailable balance such as locked, frozen, or others.
          type: string
        pending:
          description: Pending balance.
          type: string
        staked:
          description: Staked balance.
          type: string
        frozen:
          description: Funds frozen due to the anti-money laundering policy at this workspace.
          type: string
        lockedAmount:
          description: Locked balance.
          type: string
        blockHeight:
          description: The height (number) of the block of the balance. Can by empty.
          type: string
        blockHash:
          description: The hash of the block of the balance. Can by empty.
          type: string
        creationTimestamp:
          description: Unix timestamp of the time the asset wallet was created.
          type: string
    CreateMultipleVaultAccountsJobStatus:
      type: object
      properties:
        status:
          type: string
