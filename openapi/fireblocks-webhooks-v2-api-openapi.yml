    WebhookMtlsConfig:
      type: object
      description: A signed client certificate stored for the workspace, and the id a webhook or OAuth credentials set references to use it. Several of them may share one configuration, so replacing the certificate here switches all of them at once.
      properties:
        id:
          type: string
          format: uuid
          description: The unique identifier of the mTLS configuration, to be set as `webhookMtlsId` on a webhook or on OAuth credentials.
          example: 44fcead0-7053-4831-a53a-df7fb90d440f
        name:
          type: string
          description: The label given to this mTLS configuration.
          example: Production gateway 2026
        signedCert:
          type: string
          description: The signed client certificate PEM.
          example: '-----BEGIN CERTIFICATE-----

            ...

            -----END CERTIFICATE-----'
        expiresAt:
          type: integer
          format: int64
          description: When the certificate itself expires, in milliseconds since the epoch.
          example: 1726108200000
        createdAt:
          type: integer
          format: int64
          description: When the certificate was uploaded, in milliseconds since the epoch.
          example: 1694572200000
        updatedAt:
          type: integer
          format: int64
          description: When this configuration was last changed, in milliseconds since the epoch. Differs from createdAt once the certificate has been replaced or the configuration renamed.
          example: 1726108200000
      required:
      - id
      - signedCert
      - expiresAt
      - createdAt
      - updatedAt
