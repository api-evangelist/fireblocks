          example: 6f1b7c62-0f2e-4f1a-9a5e-9f2b1c3d4e5f
        webhookOauthId:
          type:
          - string
          - 'null'
          format: uuid
          description: The id of the OAuth credentials this webhook authenticates with, from `/v1/webhooks_settings/oauth`. Several webhooks may share one credential set, so rotating its client secret covers all of them at once. Send `null` to stop using OAuth for this webhook. Cannot be combined with an `authorization` custom header on the same webhook; a request that would leave both set is rejected.
