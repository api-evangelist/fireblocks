components:
  schemas:
    WebhookOauthCustomBodyParams:
      type:
      - object
      - 'null'
      description: 'Extra parameters for the token request body — `scope` most commonly, sometimes `audience` or `resource`. Applies to every authentication method.

        Values must be strings, because the token request body is form-encoded rather than JSON. An empty string is allowed. `grant_type`, `client_id`, `client_secret`, `client_assertion` and `client_assertion_type` are set by Fireblocks and cannot be overridden. Names are case-sensitive. The whole object must be under 16 KB.

        Values are write-only; responses return only the parameter names. On update this merges key by key rather than replacing — see `WebhookOauthCustomBodyParamsUpdate`.'
      additionalProperties:
        type: string
      example:
        scope: payments.read payments.write
    WebhookOauthCustomBodyParamsUpdate:
      type:
      - object
      - 'null'
      description: 'A delta applied to the token request body parameters. A parameter with a value is added or replaced, a parameter with `null` is deleted, and one you leave out is untouched. So `{ "scope": "payments.read", "audience": null }` sets `scope`, drops `audience`, and changes nothing else.

        Send `customBodyParams: null` to clear every parameter in one call. That does not collide with a `null` value on a name: one names the parameter to delete, the other names the whole field.

        Same rules as on create: string values only, `grant_type`/`client_id`/`client_secret`/ `client_assertion`/`client_assertion_type` reserved, names case-sensitive, resulting set under 16 KB, values write-only.'
      additionalProperties:
        type:
        - string
        - 'null'
      example:
        scope: payments.read payments.write
        audience: null
    NotificationWithData:
      type: object
      properties:
        id:
          type: string
          example: 44fcead0-7053-4831-a53a-df7fb90d440f
          format: uuid
        createdAt:
          type: integer
          format: int64
          description: The creation date of the notification in milliseconds
          example: 1625126400000
        updatedAt:
          type: integer
          format: int64
          description: The date when the notification was updated in milliseconds
          example: 1625126400000
        status:
          $ref: '#/components/schemas/NotificationStatus'
        eventType:
          $ref: '#/components/schemas/WebhookEvent'
        resourceId:
          type:
          - string
          - 'null'
          default: null
          description: The resource id of the event which the Notification is listen to
          example: 44fcead0-7053-4831-a53a-df7fb90d440f
          format: uuid
        data:
          type: object
          description: notification data
      required:
      - id
      - createdAt
      - updatedAt
      - status
      - eventType
    ErrorSchema:
      type: object
      properties:
        message:
          type: string
        code:
          type: number
    ResendByQueryResponse:
      type: object
      properties:
        total:
          type: number
          description: The total number of notifications that are scheduled to be resent.
          example: 10
    NotificationAttempt:
      type: object
      properties:
        sentTime:
          type: integer
          format: int64
          description: The time when the attempt was sent in milliseconds.
          example: 1625126400000
        duration:
          type: integer
          description: The duration of the attempt in milliseconds.
          example: 130
        responseCode:
          type: integer
          description: The response code of the attempt, when missing refer to failureReason.
          example: 200
        failureReason:
          type: string
          enum:
          - TIMED_OUT
          - NO_RESPONSE
          description: The request failure reason in case responseCode is missing.
          example: TIMED_OUT
      required:
      - sentTime
      - duration
    WebhookOauthCustomJwtClaimsUpdate:
      type:
      - object
      - 'null'
      description: 'A delta applied to the JWT assertion claims. A claim with a value is added or replaced, a claim with `null` is deleted, and a claim you leave out is untouched. So `{ "aud": "https://auth.example.com", "resource": null }` sets `aud`, drops `resource`, and changes nothing else.

        Send `customJwtClaims: null` to clear every claim in one call. That does not collide with a `null` value on a name: one names the claim to delete, the other names the whole field.

        Same rules as on create: any JSON type except `null`, `iss`/`sub`/`jti`/`iat`/`exp` reserved, names case-sensitive, resulting set under 16 KB, values write-only.'
      additionalProperties:
        description: Claim value. May be any JSON type, or `null` to delete the claim.
      example:
        aud: https://auth.example.com
        resource: null
    UpdateWebhookOauthRequest:
      type: object
      description: 'A partial update. Every field is optional and an omitted field is left as it is, so `{ "clientSecret": "new-secret" }` rotates the secret and changes nothing else. A rotation applies to every webhook referencing these credentials.


        The three custom maps merge. A key with a value is upserted, a key with `null` is deleted, a key you leave out is untouched, and the whole field set to `null` clears the map. There is no ambiguity between the two uses of `null` — one names an entry, the other names the field. `webhookMtlsId` is a scalar, so `null` there removes it.'
      properties:
        name:
          type: string
          description: A label for this credential set. Omit to leave it unchanged.
          example: Production treasury gateway
          minLength: 1
          maxLength: 128
        clientId:
          type: string
          description: OAuth client ID. Omit to leave it unchanged.
          example: my-client-id
          minLength: 1
          maxLength: 255
        clientSecret:
          type: string
          description: A new OAuth client secret. Limited to 480 bytes when UTF-8 encoded, so a secret using non-ASCII characters fits fewer than 480 of them. Write-only — never returned in any response. Send this on its own to rotate the secret without changing anything else. Omit to leave it unchanged.
          example: my-new-client-secret
          minLength: 1
          maxLength: 480
        url:
          type: string
          description: Token endpoint URL. HTTPS on port 443 only, and the host must resolve publicly. Omit to leave it unchanged.
          pattern: ^https://
          maxLength: 2048
          example: https://auth.example.com/oauth/token
        authMethod:
          type: string
          description: '`client_secret_basic`, `client_secret_post` or `client_secret_jwt`. Omit to leave it unchanged — it does not revert to the default.'
          example: client_secret_jwt
        customJwtClaims:
          $ref: '#/components/schemas/WebhookOauthCustomJwtClaimsUpdate'
        customBodyParams:
          $ref: '#/components/schemas/WebhookOauthCustomBodyParamsUpdate'
        customHeaders:
          $ref: '#/components/schemas/WebhookOauthCustomHeadersUpdate'
        webhookMtlsId:
          type:
          - string
          - 'null'
          format: uuid
          description: The id of the mTLS configuration presented to the token endpoint, from `/v1/webhooks_settings/mtls`. Omit to leave it unchanged, or send `null` to stop using mTLS for the token request. Requires the mTLS feature to be enabled for the workspace (`403` otherwise), a configuration of this workspace (`404` otherwise), and one linked to a private key (`400` otherwise).
          example: 6f1b7c62-0f2e-4f1a-9a5e-9f2b1c3d4e5f
    WebhookPaginatedResponse:
      type: object
      properties:
        data:
          type: array
          description: The data of the current page
          items:
            $ref: '#/components/schemas/Webhook'
        next:
          type:
          - string
          - 'null'
          description: The ID of the next page
          example: eJ0eXAiOiJKV1QiLCJhbGcOiJIUzI1NiJ9
      required:
      - data
    ResendFailedNotificationsRequest:
      type: object
      properties:
        startTime:
          type: number
          description: '(optional) Start time for the resend window in milliseconds since epoch up to 24 hours before the current time - Default if missing means 24 hours before the current time in milliseconds since epoch - Maximum value is current time in milliseconds since epoch - Minimum value is 24 hours before the current time in milliseconds since epoch

            '
          example: 1625097600000
        events:
          type: array
          description: "(optional) Event types to resend, default is all event types\n    - Default if missing means all events will be included\n    - Empty array means all events will be included\n"
          example:
          - transaction.created
          - transaction.status.updated
          items:
            $ref: '#/components/schemas/WebhookEvent'
    NotificationStatus:
      type: string
      description: The status of the Notification
      example: COMPLETED
      enum:
      - COMPLETED
      - FAILED
      - IN_PROGRESS
      - ON_HOLD
    ResendFailedNotificationsResponse:
      type: object
      properties:
        total:
          type: number
          description: The total number of failed notifications that are scheduled to be resent.
          example: 10
    Notification:
      type: object
      properties:
        id:
          type: string
          description: The id of the Notification
          example: 44fcead0-7053-4831-a53a-df7fb90d440f
          format: uuid
        createdAt:
          type: integer
          format: int64
          description: The creation date of the notification in milliseconds
          example: 1625126400000
        updatedAt:
          type: integer
          format: int64
          description: The date when the notification was updated in milliseconds
          example: 1625126400000
        status:
          $ref: '#/components/schemas/NotificationStatus'
        eventType:
          $ref: '#/components/schemas/WebhookEvent'
        resourceId:
          type:
          - string
          - 'null'
          default: null
          description: The resource id of the event which the Notification is listen to
          example: 44fcead0-7053-4831-a53a-df7fb90d440f
          format: uuid
      required:
      - id
      - createdAt
      - updatedAt
      - status
      - eventType
    WebhookOauthList:
      type: array
      description: Every OAuth credential set belonging to the workspace. Client secrets are never returned.
      items:
        $ref: '#/components/schemas/WebhookOauthCredentials'
    WebhookMtlsConfigsList:
      type: array
      description: Every mTLS configuration belonging to the workspace, newest first.
      items:
        $ref: '#/components/schemas/WebhookMtlsConfig'
    UpdateWebhookMtlsConfigRequest:
      type: object
      description: At least one property must be provided.
      minProperties: 1
      properties:
        name:
          type:
          - string
          - 'null'
          maxLength: 255
          pattern: ^[a-zA-Z0-9 ]*$
          description: A new label for this mTLS configuration, or `null` to remove it. Letters, digits and spaces only.
          example: Production gateway 2027
        signedCert:
          type: string
          description: A replacement signed certificate PEM. Every webhook and OAuth credentials set using this configuration switches to it, and the private key it was issued for is re-derived from the certificate.
          example: '-----BEGIN CERTIFICATE-----

            ...

            -----END CERTIFICATE-----'
    NotificationAttemptsPaginatedResponse:
      type: object
      properties:
        data:
          type: array
          description: The data of the current page
          items:
            $ref: '#/components/schemas/NotificationAttempt'
        next:
          type:
          - string
          - 'null'
          description: The ID of the next page
          example: eJ0eXAiOiJKV1QiLCJhbGcOiJIUzI1NiJ9
      required:
      - data
    WebhookMtlsCsrResponse:
      type: object
      description: mTLS Certificate Signing Request response
      properties:
        csr:
          type: string
          description: The Fireblocks PEM-encoded Certificate Signing Request (CSR).
          example: '-----BEGIN CERTIFICATE REQUEST-----

            ...

            -----END CERTIFICATE REQUEST-----'
        keyAlgorithm:
          $ref: '#/components/schemas/WebhookMtlsKeyAlgorithm'
      required:
      - csr
      - keyAlgorithm
    DeleteWebhookOauthResponse:
      description: The deleted OAuth credential set, plus the ids of any webhooks the delete detached from it. Webhooks are only detached by `forceDelete=true`; without it a delete is refused with `409` while anything still references the credentials.
      allOf:
      - $ref: '#/components/schemas/WebhookOauthCredentials'
      - type: object
        properties:
          detachedWebhookIds:
            type: array
            description: Webhooks whose `webhookOauthId` was cleared. The webhooks themselves are not deleted and keep delivering, just without an `Authorization` header. Empty unless `forceDelete=true` detached something.
            items:
              type: string
              format: uuid
            example:
            - 44fcead0-7053-4831-a53a-df7fb90d440f
        required:
        - detachedWebhookIds
    WebhookMtlsKeyAlgorithm:
      type: string
      description: Algorithm of the Fireblocks-held mTLS private key. A workspace may hold one key of each type, so a CSR is always returned for the type requested, and the type is echoed back on the response. ECDSA keys are smaller and quicker to issue, but the certificate authority signing the request has to accept an EC subject key, which some do not by default.
      example: RSA
      enum:
      - RSA
      - ECDSA
    WebhookCustomHeaders:
      type: object
      description: 'Custom HTTP headers attached to every notification delivered by this webhook.

        A value is a string, sent as one header line, or an array of strings, sent as one header line per element under the same name. `Cookie` and `Authorization` accept only a string. An empty array is rejected — leave the name out instead.

        At most 10 headers, counted by name — an array value counts once, however many lines it sends. Names must be valid HTTP header tokens, are case-insensitive, and are at most 128 characters. A value may be empty and has no length limit of its own; the whole object must be under 16 KB when serialized as UTF-8. A value that large may still be refused by your own endpoint, since web servers commonly cap the whole request header block at around 8 KB.

        Reserved names: `Host`, `Content-Type`, `Content-Length`, `Transfer-Encoding`, `Connection`, `User-Agent`, `Accept`, `Accept-Encoding`, `Fireblocks-Signature`, `Fireblocks-Webhook-Signature`. `Authorization` may be set, but not together with `webhookOauthId`; a request that would leave both set is rejected.

        Values are write-only; responses return only the header names.'
      additionalProperties:
        description: 'A string, sent as one header line, or an array of strings, sent as one header line per element. A string may be empty: RFC 9110 §5.5 permits an empty field value, and it reaches your endpoint as an empty value rather than being dropped. A value has no length limit of its own and must not contain control characters. An array must not be empty and is not accepted for `Cookie` or `Authorization`.'
