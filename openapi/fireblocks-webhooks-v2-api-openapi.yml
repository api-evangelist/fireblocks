    CreateWebhookOauthRequest:
      type: object
      description: A new reusable OAuth 2.0 client credential set. Attach it to a webhook by passing the returned id as that webhook's `webhookOauthId`. Several webhooks may share one credential set, so rotating its client secret covers all of them at once.
      properties:
        name:
          type: string
          description: A label for this credential set, shown when listing them.
          example: Production treasury gateway
          minLength: 1
          maxLength: 128
        clientId:
          type: string
          description: OAuth client ID used to authenticate with the token endpoint.
          example: my-client-id
          minLength: 1
          maxLength: 255
        clientSecret:
          type: string
          description: OAuth client secret. Write-only — never returned. Limited to 480 bytes UTF-8 encoded. With `client_secret_jwt` it signs the assertion rather than being sent.
          example: my-client-secret
          minLength: 1
          maxLength: 480
        url:
          type: string
          description: Token endpoint URL. HTTPS on port 443 only, and the host must resolve publicly — localhost and private, link-local or loopback addresses are rejected.
          pattern: ^https://
          maxLength: 2048
          example: https://auth.example.com/oauth/token
        authMethod:
          type: string
          default: client_secret_basic
          description: How the client credentials reach the token endpoint. `client_secret_basic` uses an HTTP Basic header, `client_secret_post` uses form fields in the body, and `client_secret_jwt` sends a JWT assertion signed with the secret, so the secret itself is never transmitted. Defaults to `client_secret_basic`.
          example: client_secret_basic
        customJwtClaims:
          $ref: '#/components/schemas/WebhookOauthCustomJwtClaims'
        customBodyParams:
          $ref: '#/components/schemas/WebhookOauthCustomBodyParams'
        customHeaders:
          $ref: '#/components/schemas/WebhookOauthCustomHeaders'
        webhookMtlsId:
          type:
          - string
          - 'null'
          format: uuid
          description: The id of the mTLS configuration presented to the token endpoint, from `/v1/webhooks_settings/mtls`. It can be the same configuration a webhook uses, so one certificate, signed from `GET /v1/webhooks_settings/mtls_csr`, serves both the token endpoint and the receiver. Omit, or send `null`, for a token request without mTLS. Requires the mTLS feature to be enabled for the workspace (`403` otherwise), a configuration of this workspace (`404` otherwise), and one linked to a private key (`400` otherwise).
          example: 6f1b7c62-0f2e-4f1a-9a5e-9f2b1c3d4e5f
      required:
      - name
      - clientId
      - clientSecret
      - url
    ResendNotificationsByResourceIdRequest:
