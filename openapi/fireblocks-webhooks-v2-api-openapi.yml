          description: Bulk resend job ID
          example: 123e4567-e89b-12d3-a456-426614174000
        status:
          type: string
          description: Bulk resend job status
          example: COMPLETED
          enum:
          - QUEUED
          - IN_PROGRESS
          - COMPLETED
          - FAILED
        processed:
          type: number
          description: Number of notifications processed
          example: 100
        total:
          type: number
          description: Total number of notifications to process
          example: 1000
      required:
      - jobId
      - status
      - processed
      - total
    WebhookOauthCredentials:
      type: object
      description: 'A stored OAuth 2.0 client credential set, referenced by webhooks through their `webhookOauthId`. Deliveries for a webhook that references one carry `Authorization: Bearer {token}`, using a token fetched from `url` and cached until it expires, so your authorization server sees far fewer token requests than deliveries. Secret material is never returned: `clientSecret` is absent from this schema entirely, and the `customJwtClaims`, `customBodyParams` and `customHeaders` fields are reduced to their names, without the configured values.'
      properties:
        id:
          type: string
          description: The id of the OAuth credentials. Pass this as a webhook's `webhookOauthId` to attach them.
          example: 123e4567-e89b-12d3-a456-426614174000
          format: uuid
        name:
          type: string
          description: The label given to this credential set.
          example: Production treasury gateway
        clientId:
          type: string
          description: OAuth client ID used to authenticate with the token endpoint.
          example: my-client-id
        url:
          type: string
          description: Token endpoint URL.
          example: https://auth.example.com/oauth/token
        authMethod:
          type: string
          default: client_secret_basic
          description: 'How the client credentials are presented to the token endpoint: `client_secret_basic`, `client_secret_post` or `client_secret_jwt`. Credentials created without this field report `client_secret_basic`, which is what they use.'
          example: client_secret_basic
        customJwtClaims:
          type: array
          description: Names of the additional claims placed in the JWT assertion. Claim values are write-only and are never returned. Absent when no custom claims are configured.
          items:
            type: string
          example:
          - aud
          - resource
        customBodyParams:
          type: array
          description: Names of the additional parameters added to the token request body. Parameter values are write-only and are never returned. Absent when no custom parameters are configured.
          items:
            type: string
          example:
          - scope
        customHeaders:
          type: array
          description: Names of the additional HTTP headers added to **the token request sent to the authorization server** — not to the webhook delivery, which has its own separate `customHeaders`. Header values are write-only and are never returned. Absent when no custom headers are configured.
          items:
            type: string
          example:
          - X-Api-Key
        webhookMtlsId:
          type: string
          format: uuid
          description: The id of the mTLS configuration presented to the token endpoint. Absent when the token request does not use mTLS. Read the certificate from `/v1/webhooks_settings/mtls/{id}`.
          example: 6f1b7c62-0f2e-4f1a-9a5e-9f2b1c3d4e5f
        createdAt:
          type: integer
          format: int64
          description: The date and time the OAuth credentials were created, in milliseconds.
          example: 1625097600000
        updatedAt:
          type: integer
          format: int64
          description: The date and time the OAuth credentials were last updated, in milliseconds.
          example: 1625097600000
      required:
      - id
      - name
      - clientId
      - url
      - authMethod
      - createdAt
      - updatedAt
    WebhookCustomHeadersResponse:
      type: array
      description: Names of the custom headers configured for this webhook. Header values are never returned.
      items:
        type: string
      example:
      - x-gateway-key
      - x-region-tag
    DeleteWebhookMtlsConfigResponse:
      description: The deleted mTLS configuration, plus the ids of any webhooks and OAuth credentials the delete detached from it. They are only detached by `forceDelete=true`; without it a delete is refused with `409` while anything still references the configuration.
      allOf:
      - $ref: '#/components/schemas/WebhookMtlsConfig'
      - type: object
        properties:
          detachedWebhookIds:
            type: array
            description: Webhooks whose `webhookMtlsId` was cleared. The webhooks themselves are not deleted and keep delivering, just without a client certificate. Empty unless `forceDelete=true` detached something.
            items:
              type: string
              format: uuid
            example:
            - 44fcead0-7053-4831-a53a-df7fb90d440f
          detachedWebhookOauthIds:
            type: array
            description: OAuth credentials whose `webhookMtlsId` was cleared. Their token requests continue without a client certificate. Empty unless `forceDelete=true` detached something.
            items:
              type: string
              format: uuid
            example:
            - 6e5daa9a-56cd-4975-ac16-bb9d1b48dff5
        required:
        - detachedWebhookIds
        - detachedWebhookOauthIds
  parameters:
    X-Idempotency-Key:
      name: Idempotency-Key
      in: header
      description: A unique identifier for the request. If the request is sent multiple times with the same idempotency key, the server will return the same response as the first request. The idempotency key is valid for 24 hours.
      required: false
      schema:
        type: string
  headers:
    Location:
      schema:
        type: string
      description: The location URL of the request status
    X-Request-ID:
      schema:
        type: string
      description: Unique ID correlated to the API request. Please provide it in any support ticket you create or on Github issues related to Fireblocks SDKs
  responses:
    Error:
      description: Error Response
      headers:
        X-Request-ID:
          $ref: '#/components/headers/X-Request-ID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorSchema'
  securitySchemes:
    bearerTokenAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
