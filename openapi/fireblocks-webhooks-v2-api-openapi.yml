          description: "(optional) List of notification statuses to exclude from the resend operation\n    - Empty array means all statuses will be included\n    - If you want to exclude some statuses, you can use the following example: [ IN_PROGRESS, FAILED ]\n    - Default if missing, means all statuses other than \"COMPLETED\" will be included\n"
          example:
          - IN_PROGRESS
          - FAILED
          items:
            $ref: '#/components/schemas/NotificationStatus'
      required:
      - resourceId
    WebhookCustomHeadersUpdate:
      type:
      - object
      - 'null'
      description: 'A delta applied to the delivery headers. A header with a value is added or replaced, a header with `null` is deleted, and one you leave out is untouched. A value replaces what is stored under that name rather than adding to it, so an array is the complete new set of lines for that header.

        Send `customHeaders: null` to clear every header in one call. That does not collide with a `null` value on a name: one names the header to delete, the other names the whole field.

        Names are case-insensitive, so a `null` under one casing deletes a header stored under another.

        Same rules as on create: string or non-empty array, `Cookie` and `Authorization` string-only, 10 headers and under 16 KB in the resulting set, the same reserved names, and values write-only. Entries set to `null` do not count towards the limit. `Authorization` cannot be combined with `webhookOauthId`, though one request may add it and detach the credentials together.'
      additionalProperties:
        description: A string, sent as one header line, or an array of strings, sent as one header line per element, or `null` to delete the header. A string may be empty. A value has no length limit of its own and must not contain control characters. An array must not be empty and is not accepted for `Cookie` or `Authorization`.
        example: abc123
      example:
        X-Gateway-Key: abc123
        X-Forwarded-For:
        - 203.0.113.7
        - 198.51.100.4
        X-Region-Tag: null
    ResendFailedNotificationsJobStatusResponse:
      type: object
      properties:
        jobId:
