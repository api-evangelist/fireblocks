openapi: 3.2.0
info:
  title: Fireblocks Webhooks V2 API
  description: 'Fireblocks provides a suite of applications to manage digital asset operations and a complete development platform to build your business on the blockchain.


    - Visit our website for more information: Fireblocks Website

    - Visit our developer docs: Fireblocks DevPortal'
  version: 1.6.2
  contact:
    email: developers@fireblocks.com
servers:
- url: https://api.fireblocks.io/v1
  description: Fireblocks Production Environment Base URL
- url: https://sandbox-api.fireblocks.io/v1
  description: Fireblocks Sandbox Environment Base URL
tags:
- name: Webhooks V2
paths:
  /webhooks:
    post:
      operationId: createWebhook
      summary: Create a new webhook
      description: 'Creates a new webhook, which will be triggered on the specified events


        **Endpoint Permissions:** Owner, Admin, Non-Signing Admin.'
      x-rate-limit-category: write
      parameters:
      - $ref: '#/components/parameters/X-Idempotency-Key'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWebhookRequest'
      responses:
        '201':
          description: created new webhook successfully
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Webhook'
        default:
          $ref: '#/components/responses/Error'
      tags:
      - Webhooks V2
      x-readme:
        code-samples:
        - language: typescript
          code: 'const response: Promise<FireblocksResponse<Webhook>> = fireblocks.webhooksV2.createWebhook(webhooksV2ApiCreateWebhookRequest);'
          name: Fireblocks SDK TypeScript example
        - language: java
          code: CompletableFuture<ApiResponse<Webhook>> response = fireblocks.webhooksV2().createWebhook(createWebhookRequest, idempotencyKey);
          name: Fireblocks SDK Java example
        - language: python
          code: response = fireblocks.webhooks_v2.create_webhook(create_webhook_request, idempotency_key);
          name: Fireblocks SDK Python example
      x-codeSamples:
      - lang: TypeScript
        source: 'const response: Promise<FireblocksResponse<Webhook>> = fireblocks.webhooksV2.createWebhook(webhooksV2ApiCreateWebhookRequest);'
      - lang: Java
        source: CompletableFuture<ApiResponse<Webhook>> response = fireblocks.webhooksV2().createWebhook(createWebhookRequest, idempotencyKey);
      - lang: Python
        source: response = fireblocks.webhooks_v2.create_webhook(create_webhook_request, idempotency_key);
    get:
      operationId: getWebhooks
      summary: Get all webhooks
      description: Get all webhooks (paginated).
      x-rate-limit-category: query
      parameters:
      - name: order
        required: false
        in: query
        description: ASC / DESC ordering (default DESC)
        schema:
          default: DESC
          example: ASC
          enum:
          - ASC
          - DESC
          type: string
      - name: pageCursor
        required: false
        in: query
        description: Cursor of the required page
        schema:
          type: string
      - name: pageSize
        required: false
        in: query
        description: Maximum number of items in the page
        schema:
          minimum: 1
          maximum: 100
          default: 10
          example: 10
          type: number
      responses:
        '200':
          description: A paginated response containing WebhookDto objects
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookPaginatedResponse'
        default:
          $ref: '#/components/responses/Error'
      tags:
      - Webhooks V2
      x-readme:
        code-samples:
        - language: typescript
          code: 'const response: Promise<FireblocksResponse<WebhookPaginatedResponse>> = fireblocks.webhooksV2.getWebhooks(webhooksV2ApiGetWebhooksRequest);'
          name: Fireblocks SDK TypeScript example
        - language: java
          code: CompletableFuture<ApiResponse<WebhookPaginatedResponse>> response = fireblocks.webhooksV2().getWebhooks(order, pageCursor, pageSize);
          name: Fireblocks SDK Java example
        - language: python
          code: response = fireblocks.webhooks_v2.get_webhooks(order, page_cursor, page_size);
          name: Fireblocks SDK Python example
      x-codeSamples:
      - lang: TypeScript
        source: 'const response: Promise<FireblocksResponse<WebhookPaginatedResponse>> = fireblocks.webhooksV2.getWebhooks(webhooksV2ApiGetWebhooksRequest);'
      - lang: Java
        source: CompletableFuture<ApiResponse<WebhookPaginatedResponse>> response = fireblocks.webhooksV2().getWebhooks(order, pageCursor, pageSize);
      - lang: Python
        source: response = fireblocks.webhooks_v2.get_webhooks(order, page_cursor, page_size);
  /webhooks_settings/mtls:
    post:
      operationId: createWebhookMtlsConfig
      summary: Create an mTLS configuration
      description: 'Stores a certificate signed against the CSR from `GET /v1/webhooks_settings/mtls_csr` and returns its id, which is then set as `webhookMtlsId` on a webhook or on OAuth credentials. The private key the certificate was issued for is derived from the certificate, so it is never named by the caller.


        Re-uploading a certificate already stored returns the existing id rather than creating a second configuration, so several webhooks and OAuth credentials can share one certificate.


        A certificate that was not issued for a private key this workspace holds is rejected with a `400`.


        **Endpoint Permissions:** Owner, Admin, Non-Signing Admin.'
      x-rate-limit-category: write
      parameters:
      - $ref: '#/components/parameters/X-Idempotency-Key'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWebhookMtlsConfigRequest'
      responses:
        '201':
          description: The stored mTLS configuration
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookMtlsConfig'
        default:
          $ref: '#/components/responses/Error'
      tags:
      - Webhooks V2
      x-readme:
        code-samples:
        - language: typescript
          code: 'const response: Promise<FireblocksResponse<WebhookMtlsConfig>> = fireblocks.webhooksV2.createWebhookMtlsConfig(webhooksV2ApiCreateWebhookMtlsConfigRequest);'
          name: Fireblocks SDK TypeScript example
        - language: java
          code: CompletableFuture<ApiResponse<WebhookMtlsConfig>> response = fireblocks.webhooksV2().createWebhookMtlsConfig(createWebhookMtlsConfigRequest, idempotencyKey);
          name: Fireblocks SDK Java example
        - language: python
          code: response = fireblocks.webhooks_v2.create_webhook_mtls_config(create_webhook_mtls_config_request, idempotency_key);
          name: Fireblocks SDK Python example
      x-codeSamples:
      - lang: TypeScript
        source: 'const response: Promise<FireblocksResponse<WebhookMtlsConfig>> = fireblocks.webhooksV2.createWebhookMtlsConfig(webhooksV2ApiCreateWebhookMtlsConfigRequest);'
      - lang: Java
        source: CompletableFuture<ApiResponse<WebhookMtlsConfig>> response = fireblocks.webhooksV2().createWebhookMtlsConfig(createWebhookMtlsConfigRequest, idempotencyKey);
      - lang: Python
        source: response = fireblocks.webhooks_v2.create_webhook_mtls_config(create_webhook_mtls_config_request, idempotency_key);
    get:
      operationId: getWebhookMtlsConfigs
      summary: List the uploaded mTLS configurations
      description: 'Lists the workspace''s mTLS configurations, newest first. Pass `ids` to ask about

        particular ones instead — useful for resolving the `webhookMtlsId` values on a set of

        webhooks in one call.'
      x-rate-limit-category: read
      parameters:
      - name: ids
        required: false
        in: query
        description: Return only the configurations with these ids, instead of all of them. Repeat the parameter for each id. An id belonging to another workspace, or to nothing, is left out of the response rather than failing the request.
        schema:
          type: array
          maxItems: 100
          items:
            type: string
            format: uuid
        example:
        - 6f1b7c62-0f2e-4f1a-9a5e-9f2b1c3d4e5f
      responses:
        '200':
          description: The workspace's mTLS configurations
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookMtlsConfigsList'
        default:
          $ref: '#/components/responses/Error'
      tags:
      - Webhooks V2
      x-readme:
        code-samples:
        - language: typescript
          code: 'const response: Promise<FireblocksResponse<WebhookMtlsConfigsList>> = fireblocks.webhooksV2.getWebhookMtlsConfigs(webhooksV2ApiGetWebhookMtlsConfigsRequest);'
          name: Fireblocks SDK TypeScript example
        - language: java
          code: CompletableFuture<ApiResponse<List<WebhookMtlsConfig>>> response = fireblocks.webhooksV2().getWebhookMtlsConfigs(ids);
          name: Fireblocks SDK Java example
        - language: python
          code: response = fireblocks.webhooks_v2.get_webhook_mtls_configs(ids);
          name: Fireblocks SDK Python example
      x-codeSamples:
      - lang: TypeScript
        source: 'const response: Promise<FireblocksResponse<WebhookMtlsConfigsList>> = fireblocks.webhooksV2.getWebhookMtlsConfigs(webhooksV2ApiGetWebhookMtlsConfigsRequest);'
      - lang: Java
        source: CompletableFuture<ApiResponse<List<WebhookMtlsConfig>>> response = fireblocks.webhooksV2().getWebhookMtlsConfigs(ids);
      - lang: Python
        source: response = fireblocks.webhooks_v2.get_webhook_mtls_configs(ids);
  /webhooks_settings/mtls_csr:
    get:
      operationId: getMtlsCsr
      summary: Get mTLS CSR
      description: 'Returns the Certificate Signing Request (CSR) PEM that customers use to generate their signed client certificate.


        The private key the CSR is built from is held by Fireblocks and is specific to this workspace. It is created on the first request for a given key type, and the same CSR is returned on subsequent requests for that type.


        Pass `keyAlgorithm` to choose RSA or ECDSA. A workspace may hold one key of each: the CSR returned is always the one for the type requested, so a certificate signed against it matches the key used at delivery time.


        **Endpoint Permissions:** Owner, Admin, Non-Signing Admin.'
      x-rate-limit-category: read
      parameters:
      - name: keyAlgorithm
        required: false
        in: query
        description: Algorithm of the private key the CSR is generated for. ECDSA keys are smaller and quicker to issue, but the certificate authority signing the request has to accept an EC subject key, which some do not by default.
        schema:
          type: string
          enum:
          - RSA
          - ECDSA
          default: RSA
          example: RSA
      responses:
        '200':
          description: The mTLS CSR PEM
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookMtlsCsrResponse'
        default:
          $ref: '#/components/responses/Error'
      tags:
      - Webhooks V2
      x-readme:
        code-samples:
        - language: typescript
          code: 'const response: Promise<FireblocksResponse<WebhookMtlsCsrResponse>> = fireblocks.webhooksV2.getMtlsCsr(webhooksV2ApiGetMtlsCsrRequest);'
          name: Fireblocks SDK TypeScript example
        - language: java
          code: CompletableFuture<ApiResponse<WebhookMtlsCsrResponse>> response = fireblocks.webhooksV2().getMtlsCsr(keyAlgorithm);
          name: Fireblocks SDK Java example
        - language: python
          code: response = fireblocks.webhooks_v2.get_mtls_csr(key_algorithm);
          name: Fireblocks SDK Python example
      x-codeSamples:
      - lang: TypeScript
        source: 'const response: Promise<FireblocksResponse<WebhookMtlsCsrResponse>> = fireblocks.webhooksV2.getMtlsCsr(webhooksV2ApiGetMtlsCsrRequest);'
      - lang: Java
        source: CompletableFuture<ApiResponse<WebhookMtlsCsrResponse>> response = fireblocks.webhooksV2().getMtlsCsr(keyAlgorithm);
      - lang: Python
        source: response = fireblocks.webhooks_v2.get_mtls_csr(key_algorithm);
  /webhooks_settings/mtls/{webhookMtlsId}:
    get:
      operationId: getWebhookMtlsConfig
      summary: Get an mTLS configuration by id
      description: Retrieve one stored mTLS configuration by its id.
      x-rate-limit-category: read
      parameters:
      - name: webhookMtlsId
        required: true
        in: path
        description: The unique identifier of the mTLS configuration
        schema:
          format: uuid
          example: 44fcead0-7053-4831-a53a-df7fb90d440f
          type: string
      responses:
        '200':
          description: An mTLS configuration
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookMtlsConfig'
        default:
          $ref: '#/components/responses/Error'
      tags:
      - Webhooks V2
      x-readme:
        code-samples:
        - language: typescript
          code: 'const response: Promise<FireblocksResponse<WebhookMtlsConfig>> = fireblocks.webhooksV2.getWebhookMtlsConfig(webhooksV2ApiGetWebhookMtlsConfigRequest);'
          name: Fireblocks SDK TypeScript example
        - language: java
          code: CompletableFuture<ApiResponse<WebhookMtlsConfig>> response = fireblocks.webhooksV2().getWebhookMtlsConfig(webhookMtlsId);
          name: Fireblocks SDK Java example
        - language: python
          code: response = fireblocks.webhooks_v2.get_webhook_mtls_config(webhook_mtls_id);
          name: Fireblocks SDK Python example
      x-codeSamples:
      - lang: TypeScript
        source: 'const response: Promise<FireblocksResponse<WebhookMtlsConfig>> = fireblocks.webhooksV2.getWebhookMtlsConfig(webhooksV2ApiGetWebhookMtlsConfigRequest);'
      - lang: Java
        source: CompletableFuture<ApiResponse<WebhookMtlsConfig>> response = fireblocks.webhooksV2().getWebhookMtlsConfig(webhookMtlsId);
      - lang: Python
        source: response = fireblocks.webhooks_v2.get_webhook_mtls_config(webhook_mtls_id);
    patch:
      operationId: updateWebhookMtlsConfig
      summary: Update an mTLS configuration
      description: 'Renames a configuration, replaces its certificate, or both. Only the fields present in the request are changed; anything omitted is left as it is, and a request with neither field is rejected with a `400`.


        Replacing `signedCert` switches every webhook and OAuth credentials set using this configuration over to the new certificate in one write, and the private key it was issued for is re-derived from the certificate. A replacement that was not issued for a private key this workspace holds is rejected with a `400`.


        Sending `name: null` removes the label.


        **Endpoint Permissions:** Owner, Admin, Non-Signing Admin.'
      x-rate-limit-category: write
      parameters:
      - name: webhookMtlsId
        required: true
        in: path
        description: The unique identifier of the mTLS configuration
        schema:
          format: uuid
          example: 44fcead0-7053-4831-a53a-df7fb90d440f
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateWebhookMtlsConfigRequest'
      responses:
        '200':
          description: The updated mTLS configuration
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookMtlsConfig'
        '400':
          description: Neither `name` nor `signedCert` was provided, so there is nothing to change, or the replacement certificate was rejected — it is not valid X.509, or it was not issued for a private key this workspace holds.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorSchema'
        default:
          $ref: '#/components/responses/Error'
      tags:
      - Webhooks V2
      x-readme:
        code-samples:
        - language: typescript
          code: 'const response: Promise<FireblocksResponse<WebhookMtlsConfig>> = fireblocks.webhooksV2.updateWebhookMtlsConfig(webhooksV2ApiUpdateWebhookMtlsConfigRequest);'
          name: Fireblocks SDK TypeScript example
        - language: java
          code: CompletableFuture<ApiResponse<WebhookMtlsConfig>> response = fireblocks.webhooksV2().updateWebhookMtlsConfig(updateWebhookMtlsConfigRequest, webhookMtlsId);
          name: Fireblocks SDK Java example
        - language: python
          code: response = fireblocks.webhooks_v2.update_webhook_mtls_config(update_webhook_mtls_config_request, webhook_mtls_id);
          name: Fireblocks SDK Python example
      x-codeSamples:
      - lang: TypeScript
        source: 'const response: Promise<FireblocksResponse<WebhookMtlsConfig>> = fireblocks.webhooksV2.updateWebhookMtlsConfig(webhooksV2ApiUpdateWebhookMtlsConfigRequest);'
      - lang: Java
        source: CompletableFuture<ApiResponse<WebhookMtlsConfig>> response = fireblocks.webhooksV2().updateWebhookMtlsConfig(updateWebhookMtlsConfigRequest, webhookMtlsId);
      - lang: Python
        source: response = fireblocks.webhooks_v2.update_webhook_mtls_config(update_webhook_mtls_config_request, webhook_mtls_id);
    delete:
      operationId: deleteWebhookMtlsConfig
      summary: Delete an mTLS configuration
      description: 'Deletes an mTLS configuration. By default the delete is refused while the configuration is still in use: if any webhook or OAuth credentials reference it, nothing is deleted and the request fails with `409 Conflict`, naming the reason and listing the ids of what references it. This protects a shared configuration from being removed out from under the webhooks and token requests that depend on it.


        Pass `forceDelete=true` to delete anyway. That detaches everything referencing it — it clears `webhookMtlsId` on each webhook and OAuth credentials, it does **not** delete them — then deletes the configuration and returns the deleted resource together with `detachedWebhookIds` and `detachedWebhookOauthIds`. Detached webhooks keep delivering notifications, and detached OAuth credentials keep requesting tokens, but without a client certificate, so an endpoint that requires mTLS will reject them from that point on.


        When nothing references the configuration the delete succeeds either way, and both lists come back empty.


        **Endpoint Permissions:** Owner, Admin, Non-Signing Admin.'
      x-rate-limit-category: write
      parameters:
      - name: webhookMtlsId
        required: true
        in: path
        description: The unique identifier of the mTLS configuration
        schema:
          format: uuid
          example: 44fcead0-7053-4831-a53a-df7fb90d440f
          type: string
      - name: forceDelete
        required: false
        in: query
        description: Delete the configuration even while webhooks or OAuth credentials still reference it, detaching them instead of refusing; their ids are returned in `detachedWebhookIds` and `detachedWebhookOauthIds`. Leave it unset, or `false`, to get a `409 Conflict` whenever anything still references the configuration.
        schema:
          type: boolean
          default: false
        example: true
      responses:
        '200':
          description: The deleted mTLS configuration, plus the ids of any webhooks and OAuth credentials that were detached from it
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteWebhookMtlsConfigResponse'
        '409':
          description: Webhooks or OAuth credentials still reference this configuration and `forceDelete` was not set. Nothing was deleted. The error message names the reason and the ids of what references it — detach those webhooks and OAuth credentials, or retry with `forceDelete=true`.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorSchema'
        default:
          $ref: '#/components/responses/Error'
      tags:
      - Webhooks V2
      x-readme:
        code-samples:
        - language: typescript
          code: 'const response: Promise<FireblocksResponse<DeleteWebhookMtlsConfigResponse>> = fireblocks.webhooksV2.deleteWebhookMtlsConfig(webhooksV2ApiDeleteWebhookMtlsConfigRequest);'
          name: Fireblocks SDK TypeScript example
        - language: java
          code: CompletableFuture<ApiResponse<DeleteWebhookMtlsConfigResponse>> response = fireblocks.webhooksV2().deleteWebhookMtlsConfig(webhookMtlsId, forceDelete);
          name: Fireblocks SDK Java example
        - language: python
          code: response = fireblocks.webhooks_v2.delete_webhook_mtls_config(webhook_mtls_id, force_delete);
          name: Fireblocks SDK Python example
      x-codeSamples:
      - lang: TypeScript
        source: 'const response: Promise<FireblocksResponse<DeleteWebhookMtlsConfigResponse>> = fireblocks.webhooksV2.deleteWebhookMtlsConfig(webhooksV2ApiDeleteWebhookMtlsConfigRequest);'
      - lang: Java
        source: CompletableFuture<ApiResponse<DeleteWebhookMtlsConfigResponse>> response = fireblocks.webhooksV2().deleteWebhookMtlsConfig(webhookMtlsId, forceDelete);
      - lang: Python
        source: response = fireblocks.webhooks_v2.delete_webhook_mtls_config(webhook_mtls_id, force_delete);
  /webhooks_settings/oauth:
    post:
      operationId: createWebhookOauth
      summary: Create OAuth credentials
      description: 'Creates a reusable OAuth client credential set. Attach it to a webhook by passing the returned id as that webhook''s `webhookOauthId`. Several webhooks may share one credential set, so rotating its client secret covers all of them at once. The client secret is write-only and is never returned.


        **Endpoint Permissions:** Owner, Admin, Non-Signing Admin.'
      x-rate-limit-category: write
      parameters:
      - $ref: '#/components/parameters/X-Idempotency-Key'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWebhookOauthRequest'
      responses:
        '201':
          description: created the OAuth credentials successfully
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookOauthCredentials'
        default:
          $ref: '#/components/responses/Error'
      tags:
      - Webhooks V2
      x-readme:
        code-samples:
        - language: typescript
          code: 'const response: Promise<FireblocksResponse<WebhookOauthCredentials>> = fireblocks.webhooksV2.createWebhookOauth(webhooksV2ApiCreateWebhookOauthRequest);'
          name: Fireblocks SDK TypeScript example
        - language: java
          code: CompletableFuture<ApiResponse<WebhookOauthCredentials>> response = fireblocks.webhooksV2().createWebhookOauth(createWebhookOauthRequest, idempotencyKey);
          name: Fireblocks SDK Java example
        - language: python
          code: response = fireblocks.webhooks_v2.create_webhook_oauth(create_webhook_oauth_request, idempotency_key);
          name: Fireblocks SDK Python example
      x-codeSamples:
      - lang: TypeScript
        source: 'const response: Promise<FireblocksResponse<WebhookOauthCredentials>> = fireblocks.webhooksV2.createWebhookOauth(webhooksV2ApiCreateWebhookOauthRequest);'
      - lang: Java
        source: CompletableFuture<ApiResponse<WebhookOauthCredentials>> response = fireblocks.webhooksV2().createWebhookOauth(createWebhookOauthRequest, idempotencyKey);
      - lang: Python
        source: response = fireblocks.webhooks_v2.create_webhook_oauth(create_webhook_oauth_request, idempotency_key);
    get:
      operationId: getWebhookOauths
      summary: Get all OAuth credentials
      description: Lists every OAuth credential set for the workspace. Client secrets are never returned.
      x-rate-limit-category: read
      responses:
        '200':
          description: The workspace's OAuth credentials
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookOauthList'
        default:
          $ref: '#/components/responses/Error'
      tags:
      - Webhooks V2
      x-readme:
        code-samples:
        - language: typescript
          code: 'const response: Promise<FireblocksResponse<WebhookOauthList>> = fireblocks.webhooksV2.getWebhookOauths();'
          name: Fireblocks SDK TypeScript example
        - language: java
          code: CompletableFuture<ApiResponse<List<WebhookOauthCredentials>>> response = fireblocks.webhooksV2().getWebhookOauths();
          name: Fireblocks SDK Java example
        - language: python
          code: response = fireblocks.webhooks_v2.get_webhook_oauths();
          name: Fireblocks SDK Python example
      x-codeSamples:
      - lang: TypeScript
        source: 'const response: Promise<FireblocksResponse<WebhookOauthList>> = fireblocks.webhooksV2.getWebhookOauths();'
      - lang: Java
        source: CompletableFuture<ApiResponse<List<WebhookOauthCredentials>>> response = fireblocks.webhooksV2().getWebhookOauths();
      - lang: Python
        source: response = fireblocks.webhooks_v2.get_webhook_oauths();
  /webhooks_settings/oauth/{webhookOauthId}:
    get:
      operationId: getWebhookOauth
      summary: Get OAuth credentials by id
      description: Retrieve an OAuth credential set by its id. The client secret is never returned.
      x-rate-limit-category: read
      parameters:
      - name: webhookOauthId
        required: true
        in: path
        description: The unique identifier of the OAuth credentials
        schema:
          format: uuid
          example: 44fcead0-7053-4831-a53a-df7fb90d440f
          type: string
      responses:
        '200':
          description: An OAuth credentials object
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookOauthCredentials'
        default:
          $ref: '#/components/responses/Error'
      tags:
      - Webhooks V2
      x-readme:
        code-samples:
        - language: typescript
