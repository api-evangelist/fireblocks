    patch:
      operationId: updateWebhookOauth
      summary: Update OAuth credentials
      description: 'Updates only the fields present in the request; anything omitted is left as it is. Sending `clientSecret` on its own rotates the secret for every webhook using these credentials.


        `customJwtClaims`, `customBodyParams` and `customHeaders` are all merged key by key rather than replaced, the same way a webhook''s own `customHeaders` behaves: a key sent with a value is added or overwritten, a key sent with a `null` value is deleted, and a key you omit is left alone. Setting one of the three to `null` as a whole clears that map, which is the quick way to empty it without naming every key. There is no ambiguity between the two uses of `null` — one names an entry to delete, the other names the field. A claim cannot be set to JSON `null`, though, on this endpoint or on create, because `null` is spent on deletion. `webhookMtlsId` is a scalar rather than a map, so `null` there does remove it.


        **Endpoint Permissions:** Owner, Admin, Non-Signing Admin.'
      x-rate-limit-category: write
      parameters:
      - name: webhookOauthId
        required: true
        in: path
        description: The unique identifier of the OAuth credentials
        schema:
          format: uuid
          example: 44fcead0-7053-4831-a53a-df7fb90d440f
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateWebhookOauthRequest'
      responses:
        '200':
          description: Updated OAuth credentials object
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookOauthCredentials'
        default:
          $ref: '#/components/responses/Error'
      tags:
      - Webhooks V2
      x-readme:
        code-samples:
        - language: typescript
          code: 'const response: Promise<FireblocksResponse<WebhookOauthCredentials>> = fireblocks.webhooksV2.updateWebhookOauth(webhooksV2ApiUpdateWebhookOauthRequest);'
          name: Fireblocks SDK TypeScript example
        - language: java
          code: CompletableFuture<ApiResponse<WebhookOauthCredentials>> response = fireblocks.webhooksV2().updateWebhookOauth(updateWebhookOauthRequest, webhookOauthId);
          name: Fireblocks SDK Java example
        - language: python
          code: response = fireblocks.webhooks_v2.update_webhook_oauth(update_webhook_oauth_request, webhook_oauth_id);
          name: Fireblocks SDK Python example
      x-codeSamples:
      - lang: TypeScript
        source: 'const response: Promise<FireblocksResponse<WebhookOauthCredentials>> = fireblocks.webhooksV2.updateWebhookOauth(webhooksV2ApiUpdateWebhookOauthRequest);'
      - lang: Java
        source: CompletableFuture<ApiResponse<WebhookOauthCredentials>> response = fireblocks.webhooksV2().updateWebhookOauth(updateWebhookOauthRequest, webhookOauthId);
      - lang: Python
        source: response = fireblocks.webhooks_v2.update_webhook_oauth(update_webhook_oauth_request, webhook_oauth_id);
    delete:
      operationId: deleteWebhookOauth
      summary: Delete OAuth credentials
      description: 'Deletes an OAuth credential set. By default the delete is refused while the credentials are still in use: if any webhook references them, nothing is deleted and the request fails with `409 Conflict`, naming the reason and listing the ids of the referencing webhooks. This protects a shared credential set from being removed out from under the webhooks that depend on it, since several webhooks may reference the same one.


        Pass `forceDelete=true` to delete anyway. That detaches every referencing webhook — it clears each webhook''s `webhookOauthId`, it does **not** delete the webhook — then deletes the credential set and returns the deleted resource together with `detachedWebhookIds`. The detached webhooks keep delivering notifications, but without an `Authorization` header, so their endpoints will see unauthenticated deliveries from that point on.


        When nothing references the credentials the delete succeeds either way, and `detachedWebhookIds` comes back empty.


        **Endpoint Permissions:** Owner, Admin, Non-Signing Admin.'
      x-rate-limit-category: write
      parameters:
      - name: webhookOauthId
        required: true
        in: path
        description: The unique identifier of the OAuth credentials
        schema:
          format: uuid
          example: 44fcead0-7053-4831-a53a-df7fb90d440f
          type: string
      - name: forceDelete
        required: false
        in: query
        description: Delete the credentials even while webhooks still reference them, detaching those webhooks instead of refusing. Leave it unset, or `false`, to get a `409 Conflict` whenever anything still references the credentials.
        schema:
          type: boolean
          default: false
        example: true
      responses:
        '200':
          description: The deleted OAuth credentials, plus the ids of any webhooks that were detached from them
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteWebhookOauthResponse'
        '409':
          description: Webhooks still reference these credentials and `forceDelete` was not set. Nothing was deleted. The error message names the reason and the ids of the referencing webhooks — detach or delete those webhooks, or retry with `forceDelete=true`.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorSchema'
        default:
          $ref: '#/components/responses/Error'
      tags:
      - Webhooks V2
      x-readme:
        code-samples:
        - language: typescript
          code: 'const response: Promise<FireblocksResponse<DeleteWebhookOauthResponse>> = fireblocks.webhooksV2.deleteWebhookOauth(webhooksV2ApiDeleteWebhookOauthRequest);'
          name: Fireblocks SDK TypeScript example
        - language: java
          code: CompletableFuture<ApiResponse<DeleteWebhookOauthResponse>> response = fireblocks.webhooksV2().deleteWebhookOauth(webhookOauthId, forceDelete);
          name: Fireblocks SDK Java example
        - language: python
          code: response = fireblocks.webhooks_v2.delete_webhook_oauth(webhook_oauth_id, force_delete);
          name: Fireblocks SDK Python example
      x-codeSamples:
      - lang: TypeScript
        source: 'const response: Promise<FireblocksResponse<DeleteWebhookOauthResponse>> = fireblocks.webhooksV2.deleteWebhookOauth(webhooksV2ApiDeleteWebhookOauthRequest);'
      - lang: Java
        source: CompletableFuture<ApiResponse<DeleteWebhookOauthResponse>> response = fireblocks.webhooksV2().deleteWebhookOauth(webhookOauthId, forceDelete);
      - lang: Python
        source: response = fireblocks.webhooks_v2.delete_webhook_oauth(webhook_oauth_id, force_delete);
