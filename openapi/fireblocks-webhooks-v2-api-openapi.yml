        endTime:
          type: number
          description: '(optional) End time for the resend window in milliseconds since epoch, within the last 72 hours - Default if missing means current time in milliseconds since epoch - Requires startTime to be provided - Must be after startTime - Time window between startTime and endTime must not exceed 24 hours

            '
          example: 1625184000000
        events:
          type: array
          description: "(optional) Event types to resend, default is all event types\n    - Default if missing means all events will be included\n    - Empty array means all events will be included\n"
