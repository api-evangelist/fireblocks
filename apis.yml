apis:
- aid: fireblocks:fireblocks-vaults-api
  name: Fireblocks Vaults API
  tags:
  - Digital Assets
  - Vaults
  - Custody
  - MPC
  humanURL: https://developers.fireblocks.com/reference/api-overview
  baseURL: https://api.fireblocks.io/v1
  properties:
  - url: https://developers.fireblocks.com/reference/api-overview
    type: Documentation
  - url: openapi/fireblocks-vaults-api-openapi.yml
    type: OpenAPI
  - url: json-schema/fireblocks-vault-account-schema.json
    type: JSONSchema
  - url: json-ld/fireblocks-context.jsonld
    type: JSONLD
  description: >-
    Create and manage vault accounts, asset wallets, deposit addresses, attached tags, and balance inquiries.
    Vaults are the root container for MPC-secured keys, balances, and transactions inside a Fireblocks
    workspace. Supports paged listing, bulk address creation, customer-ref-id tagging, auto-fuel toggling,
    and UTXO/unspent-input enumeration.
- aid: fireblocks:fireblocks-transactions-api
  name: Fireblocks Transactions API
  tags:
  - Digital Assets
  - Transactions
  - MPC
  - Custody
  humanURL: https://developers.fireblocks.com/reference/api-overview
  baseURL: https://api.fireblocks.io/v1
  properties:
  - url: https://developers.fireblocks.com/reference/api-overview
    type: Documentation
  - url: openapi/fireblocks-transactions-api-openapi.yml
    type: OpenAPI
  - url: json-schema/fireblocks-transaction-schema.json
    type: JSONSchema
  - url: json-ld/fireblocks-context.jsonld
    type: JSONLD
  description: >-
    Create, cancel, drop, and query digital-asset transactions across all supported chains. Every transaction
    passes the workspace Policy Engine, is signed by the MPC quorum, and is broadcast under Fireblocks'
    fee-bump-and-rebroadcast logic. Supports transfers, raw signings, typed-message signings, contract
    calls, drop-and-replace, fee estimation, validate-address, and approval-request management.
- aid: fireblocks:fireblocks-tokenization-api
  name: Fireblocks Tokenization API
  tags:
  - Digital Assets
  - Tokenization
  - Stablecoins
  - Smart Contracts
  humanURL: https://developers.fireblocks.com/reference/api-overview
  baseURL: https://api.fireblocks.io/v1
  properties:
  - url: https://developers.fireblocks.com/reference/api-overview
    type: Documentation
  - url: openapi/fireblocks-tokenization-api-openapi.yml
    type: OpenAPI
  - url: json-ld/fireblocks-context.jsonld
    type: JSONLD
  description: >-
    Deploy, mint, burn, and manage tokens across the chains supported by Fireblocks Tokenization Engine.
    Covers ERC-20 fungible tokens, multichain stablecoins, asset tokenization, smart contract management,
    and the full token lifecycle. Pricing is 3-30 basis points on Assets Under Custody.
- aid: fireblocks:fireblocks-staking-api
  name: Fireblocks Staking API
  tags:
  - Digital Assets
  - Staking
  - DeFi
  humanURL: https://developers.fireblocks.com/reference/api-overview
  baseURL: https://api.fireblocks.io/v1
  properties:
  - url: https://developers.fireblocks.com/reference/api-overview
    type: Documentation
  - url: openapi/fireblocks-staking-api-openapi.yml
    type: OpenAPI
  - url: json-ld/fireblocks-context.jsonld
    type: JSONLD
  description: >-
    Execute and track staking operations across multiple proof-of-stake chains. Browse staking providers
    and validators, initiate stake / unstake / withdraw / claim-rewards actions, and query position state.
    Backs institutional Earn workflows for ETH, SOL, ADA, DOT, KSM, NEAR, TEZOS, MATIC, and more.
- aid: fireblocks:fireblocks-nfts-api
  name: Fireblocks NFTs API
  tags:
  - Digital Assets
  - NFTs
  - Tokens
  humanURL: https://developers.fireblocks.com/reference/api-overview
  baseURL: https://api.fireblocks.io/v1
  properties:
