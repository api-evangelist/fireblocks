    type: Documentation
  - url: openapi/fireblocks-nfts-api-openapi.yml
    type: OpenAPI
  - url: json-ld/fireblocks-context.jsonld
    type: JSONLD
  description: >-
    Discover, index, and manage non-fungible tokens held in the workspace's vault accounts. List owned
    NFTs, fetch token-level metadata, refresh ownership state, and update token-spam classification.
- aid: fireblocks:fireblocks-compliance-api
  name: Fireblocks Compliance and Policy API
  tags:
  - Digital Assets
  - Compliance
  - AML
  - Travel Rule
  - Policy
  humanURL: https://developers.fireblocks.com/reference/api-overview
  baseURL: https://api.fireblocks.io/v1
  properties:
  - url: https://developers.fireblocks.com/reference/api-overview
    type: Documentation
  - url: openapi/fireblocks-compliance-api-openapi.yml
    type: OpenAPI
  - url: json-ld/fireblocks-context.jsonld
    type: JSONLD
  description: >-
    AML transaction screening, Travel Rule VASP messaging (FATF Recommendation 16), address registry lookups,
    and the workspace Policy Editor (Beta and V2). Wire third-party screening providers (Chainalysis,
    Elliptic, TRM) into the transaction lifecycle and codify the workspace's transaction-authorization
    rules.
- aid: fireblocks:fireblocks-gas-station-api
  name: Fireblocks Gas Station API
  tags:
  - Digital Assets
  - Gas Station
  - Fees
  humanURL: https://developers.fireblocks.com/reference/api-overview
  baseURL: https://api.fireblocks.io/v1
  properties:
  - url: https://developers.fireblocks.com/reference/api-overview
    type: Documentation
  - url: openapi/fireblocks-gas-station-api-openapi.yml
    type: OpenAPI
  - url: json-ld/fireblocks-context.jsonld
    type: JSONLD
  description: >-
    Configure the Fireblocks Gas Station — auto-fuel logic that tops up native-asset balances in vault
    accounts so ERC-20 / SPL / contract-call transactions don't fail for lack of gas. Per-asset thresholds
    are workspace-configurable.
- aid: fireblocks:fireblocks-webhooks-api
  name: Fireblocks Webhooks API
  tags:
  - Digital Assets
  - Webhooks
  - Events
  - Push
  humanURL: https://developers.fireblocks.com/reference/webhook-notifications
  baseURL: https://api.fireblocks.io/v1
  properties:
  - url: https://developers.fireblocks.com/reference/webhook-notifications
    type: Documentation
  - url: openapi/fireblocks-webhooks-api-openapi.yml
    type: OpenAPI
  - url: json-schema/fireblocks-webhook-event-schema.json
    type: JSONSchema
  - url: json-ld/fireblocks-context.jsonld
    type: JSONLD
  description: >-
    Receive push notifications when workspace events occur — TRANSACTION_CREATED, TRANSACTION_STATUS_UPDATED,
    VAULT_ACCOUNT_ADDED, EMBEDDED_WALLET_DEVICE_PAIRED, SMART_TRANSFER events, and more. Each event is
    signed with RSA-SHA512 in the Fireblocks-Signature header so the consumer can verify authenticity
    before processing. Webhooks V2 surface adds destination management and replay-from-history.
